<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沅神开播了 - 视频选集</title>
    <link rel="icon" href="ciallo.png" type="image/png">
    <style>
        :root {
            --ink: #1a2b49;
            --ink-soft: #55637c;
            --accent-1: #5b8def;
            --accent-2: #8f7bf0;
            --paper: rgba(255, 255, 255, 0.72);
            --line: rgba(0, 20, 40, 0.08);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0; padding: 2rem 1rem 3rem;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #eef4ff 0%, #f7f2ff 45%, #f2fbff 100%);
            overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background:
                radial-gradient(circle at 12% 18%, rgba(91, 141, 239, 0.16), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(143, 123, 240, 0.16), transparent 44%),
                radial-gradient(circle at 50% 92%, rgba(94, 209, 195, 0.14), transparent 46%);
        }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }
        .bg-orb {
            position: fixed; z-index: -1; border-radius: 50%; pointer-events: none;
            filter: blur(40px); opacity: 0.55; animation: orbDrift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 320px; height: 320px; top: -80px; left: -80px; background: radial-gradient(circle, rgba(91, 141, 239, 0.55), transparent 70%); }
        .orb-2 { width: 380px; height: 380px; bottom: -120px; right: -100px; background: radial-gradient(circle, rgba(143, 123, 240, 0.5), transparent 70%); animation-delay: -6s; }

        .video-card {
            width: 100%; max-width: 1000px; margin: 0 auto; padding: 3rem;
            background: var(--paper); border-radius: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px -30px rgba(0, 20, 40, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardEnter { 0% { opacity: 0; transform: translateY(40px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }

        .header-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
        .page-title {
            margin: 0; font-size: clamp(1.7rem, 4.6vw, 2.5rem); font-weight: 800; line-height: 1.3; letter-spacing: 0.02em;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: textEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes textEnter { 0% { opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

        .download-btn {
            display: inline-flex; align-items: center; gap: 0.45rem;
            padding: 0.6rem 1.3rem; font-size: 0.92rem; font-weight: 600; color: #fff; text-decoration: none;
            border-radius: 999px;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 14px 26px -16px rgba(91, 141, 239, 0.95);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }
        .download-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 32px -16px rgba(91, 141, 239, 1); }
        .download-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .episodes-container {
            display: flex; flex-wrap: wrap; gap: 0.6rem;
            max-height: 200px; overflow-y: auto; min-height: 52px;
            margin-bottom: 1.5rem; padding-bottom: 1.2rem; border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }
        .episodes-container::-webkit-scrollbar { width: 6px; }
        .episodes-container::-webkit-scrollbar-thumb { background: rgba(91, 141, 239, 0.25); border-radius: 10px; }
        .scanning-text { width: 100%; text-align: center; color: var(--ink-soft); font-size: 0.9rem; padding: 0.6rem 0; }

        .ep-btn {
            padding: 0.5rem 1.15rem; font-size: 0.92rem; font-weight: 600; cursor: pointer;
            color: var(--ink-soft); background: #fff; border: 1px solid var(--line); border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeIn 0.4s ease both;
        }
        .ep-btn:hover { transform: translateY(-2px); background: #f3f7ff; color: var(--ink); }
        .ep-btn.active {
            color: #fff; border-color: transparent;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 12px 22px -14px rgba(91, 141, 239, 0.95);
        }

        .video-title-area { display: none; margin: 0 0 0.9rem; padding: 0 0.4rem; text-align: left; }
        .video-title-area.show { display: block; }
        .video-title-text { font-size: 1.25rem; font-weight: 700; color: var(--ink); }

        .player-wrapper {
            position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
            border-radius: 1.5rem; background: #0f1a2b;
            box-shadow: 0 24px 46px -26px rgba(0, 20, 40, 0.6);
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }

        .error-overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.5rem; padding: 2rem; text-align: center; line-height: 1.7;
            background: #0f1a2b; color: #b8c6da; font-size: 1.05rem; font-weight: 600; z-index: 5;
        }
        .error-overlay svg { width: 52px; height: 52px; fill: #55637c; margin-bottom: 0.5rem; }

        /* 分段下载进度条 */
        .dl-bar { margin: 0.9rem 0.2rem 0; }
        .dl-bar__track {
            position: relative;
            height: 8px; border-radius: 999px; overflow: hidden;
            background: rgba(91, 141, 239, 0.14);
        }
        /* 浅色 = 已下载（可能还是乱序的块） */
        .dl-bar__fill {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%;
            border-radius: 999px;
            background: rgba(91, 141, 239, 0.45);
            transition: width 0.25s ease;
        }
        /* 深色 = 已经连续、可以直接播的部分 */
        .dl-bar__play {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%;
            border-radius: 999px;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            transition: width 0.25s ease;
        }
        .dl-bar__meta {
            display: flex; justify-content: space-between; gap: 0.8rem;
            margin-top: 0.45rem; font-size: 0.78rem; color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }
        .dl-bar.done .dl-bar__fill,
        .dl-bar.done .dl-bar__play { background: linear-gradient(120deg, #35b37e, #5ec3c0); }
        .dl-bar.fail .dl-bar__fill { background: #d64545; }

        .comment-card {
            width: 100%; max-width: 1000px; margin: 2rem auto 0; padding: 2.2rem 2rem;
            background: var(--paper); border-radius: 2rem; border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px -34px rgba(0, 20, 40, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }
        .comment-title {
            margin: 0 0 1.2rem; font-size: clamp(1.25rem, 3.2vw, 1.6rem); font-weight: 800; text-align: center;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .comment-card .tk-submit { margin-bottom: 1.5rem !important; }

        /* 评论区上方的“当前集数”提示 + 精简评论列表 */
        .comment-ep { margin: -0.4rem 0 1rem; text-align: center; color: var(--accent-1); font-weight: 700; font-size: 0.95rem; }
        .comment-ep:empty { display: none; }
        .ep-empty { text-align: center; color: var(--ink-soft); font-size: 0.92rem; padding: 0.6rem 0; }
        .ep-comment { padding: 0.75rem 0.2rem; border-bottom: 1px solid var(--line); }
        .ep-comment:last-child { border-bottom: none; }
        .ep-comment-head { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.86rem; color: var(--ink-soft); margin-bottom: 0.25rem; }
        .ep-comment-head b { color: var(--ink); }
        .ep-comment-body { font-size: 0.95rem; line-height: 1.75; word-break: break-word; white-space: pre-wrap; }
        .ep-badge { margin-left: 0.35rem; font-size: 0.78rem; font-weight: 700; }
        .ep-badge--verified { color: #0f9d58; }
        .ep-badge--guest { color: #6b7280; }

        /* ---------- 账号面板（和首页留言板同一套结构/类名） ---------- */
        .auth-panel {
            margin: 0 0 1.3rem; padding: 1rem 1.15rem; border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.72); border: 1px solid var(--line);
        }
        .auth-head { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 0.7rem; }
        .auth-head__title { font-size: 0.95rem; font-weight: 800; color: var(--ink); }
        #auth-status { font-size: 0.82rem; font-weight: 700; }
        #auth-status.is-guest { color: #6b7280; }
        #auth-status.is-verified { color: #0f9d58; }
        #auth-status.is-busy { color: var(--accent-1); }
        #auth-status.is-error { color: #d64545; }
        .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .auth-tabs .tab {
            font: inherit; font-size: 0.86rem; font-weight: 700; cursor: pointer;
            padding: 0.4rem 1.1rem; border-radius: 999px; color: var(--ink-soft);
            background: rgba(255, 255, 255, 0.85); border: 1px solid var(--line);
        }
        .auth-tabs .tab.is-active {
            color: #fff; border-color: transparent;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 6px 16px rgba(91, 141, 239, 0.26);
        }
        .auth-row { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
        .auth-row input {
            flex: 1 1 12rem; min-width: 0; font: inherit; font-size: 0.9rem; color: var(--ink);
            background: #fff; border: 1px solid var(--line); border-radius: 0.7rem; padding: 0.6rem 0.8rem;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-row input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.15); }
        .auth-row input:disabled { background: #f3f6fb; color: var(--ink-soft); }
        .auth-row button, .auth-user button {
            flex: 0 0 auto; font: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer;
            padding: 0.6rem 1.1rem; border-radius: 0.7rem; color: #fff; border: none;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        }
        .auth-row button:disabled { opacity: 0.55; cursor: default; }
        .auth-row button.wide { width: 100%; }
        .auth-row button.ghost, .auth-user button.ghost {
            color: var(--ink-soft); background: transparent; border: 1px solid var(--line);
        }
        .auth-user { display: flex; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
        .auth-tip { margin: 0.4rem 0 0; font-size: 0.8rem; line-height: 1.6; color: var(--ink-soft); }
        .auth-tip.nick-bad { color: #d64545; }
        .ep-lock { color: var(--ink-soft); }

        /* 评论表单的固定槽位：排在评论列表上方 */
        .ep-slot:empty { display: none; }
        .ep-slot { margin-bottom: 1.2rem; }

        /* 发表评论表单 */
        .ep-form { display: flex; flex-direction: column; gap: 0.6rem; }
        .ep-form-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .ep-input, .ep-textarea {
            font: inherit; color: var(--ink); background: #fff;
            border: 1px solid var(--line); border-radius: 0.7rem; padding: 0.6rem 0.8rem;
            outline: none; transition: border-color .2s, box-shadow .2s;
        }
        .ep-form-row .ep-input { flex: 1 1 12rem; min-width: 0; }
        .ep-textarea { width: 100%; resize: vertical; line-height: 1.7; }
        .ep-input:focus, .ep-textarea:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(91,141,239,.15); }
        .ep-form-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .ep-msg { font-size: 0.85rem; color: var(--ink-soft); }
        .ep-msg.bad { color: #d64545; }
        .ep-submit {
            font: inherit; font-weight: 700; color: #fff; border: none; cursor: pointer;
            padding: 0.6rem 1.4rem; border-radius: 999px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 6px 16px rgba(91,141,239,.28); transition: transform .15s, opacity .2s;
        }
        .ep-submit:hover { transform: translateY(-1px); }
        .ep-submit:disabled { opacity: .6; cursor: default; transform: none; }

        @media (max-width: 768px) {
            .video-card { padding: 2rem 1.25rem; border-radius: 2rem; }
            .comment-card { padding: 1.6rem 1.1rem; border-radius: 1.6rem; }
            .header-row { flex-direction: column; align-items: flex-start; }
            .download-btn { width: 100%; justify-content: center; }
            .episodes-container { max-height: 150px; }
            .ep-btn { padding: 0.45rem 0.95rem; font-size: 0.85rem; }
            .video-title-text { font-size: 1.1rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="video-card">
        <div class="header-row">
            <div class="page-title">沅神开播了</div>
            <a href="https://url13.ctfile.com/d/66483413-169028925-6c0fe3?p=D8g7Nj1w" target="_blank" rel="noopener noreferrer" class="download-btn">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                下载原视频
            </a>
        </div>

        <div class="episodes-container" id="episodes-container">
            <div class="scanning-text" id="scanning-text">正在读取视频列表，请稍候...</div>
        </div>

        <div class="video-title-area" id="video-title-area">
            <div class="video-title-text" id="video-title-text"></div>
        </div>

        <div class="player-wrapper" id="player-wrapper">
            <video id="video-player" controls preload="metadata" playsinline webkit-playsinline></video>

            <div class="error-overlay" id="error-overlay" style="display: none;">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span id="error-text">本集内容缺失</span>
            </div>
        </div>

        <!-- 分段下载进度条 -->
        <div class="dl-bar" id="dl-bar" hidden>
            <div class="dl-bar__track">
                <div class="dl-bar__fill" id="dl-bar-fill"></div>
                <div class="dl-bar__play" id="dl-bar-play"></div>
            </div>
            <div class="dl-bar__meta">
                <span id="dl-bar-text">0%</span>
                <span id="dl-bar-speed"></span>
            </div>
        </div>
    </div>

    <section class="comment-card" id="comment-card">
        <h2 class="comment-title">💬 评论区</h2>
        <div class="comment-ep" id="comment-ep"></div>
        <!-- 评论表单固定在列表上方 -->
        <div class="ep-slot" id="ep-slot"></div>

        <!-- 身份面板：和首页留言板共用同一份 localStorage，登录状态互通 -->
        <div class="auth-panel">
            <div class="auth-head">
                <span class="auth-head__title">🔐 账号</span>
                <span id="auth-status" class="is-guest">当前：游客</span>
            </div>

            <div class="auth-user" id="auth-user" hidden>
                <button id="edit-nick-btn" type="button" class="ghost">修改昵称</button>
                <button id="signout-btn" type="button" class="ghost">退出登录</button>
            </div>

            <div id="nick-pane" hidden>
                <div class="auth-row">
                    <input id="nick-input" type="text" maxlength="20" autocomplete="nickname"
                           placeholder="新昵称（最多 20 字）">
                    <button id="nick-save-btn" type="button">保存</button>
                </div>
                <div class="auth-row">
                    <button id="nick-cancel-btn" type="button" class="ghost wide">取消</button>
                </div>
                <p class="auth-tip" id="nick-tip">改的是以后评论用的昵称，已发出去的旧评论不会改名。</p>
            </div>

            <div id="auth-guest">
                <div class="auth-tabs">
                    <button id="tab-login" type="button" class="tab is-active">登录</button>
                    <button id="tab-register" type="button" class="tab">注册</button>
                </div>

                <div id="login-pane">
                    <div class="auth-row">
                        <input id="login-email" type="email" inputmode="email" autocomplete="email"
                               placeholder="邮箱" maxlength="120">
                    </div>
                    <div class="auth-row">
                        <input id="login-password" type="password" autocomplete="current-password"
                               placeholder="密码" maxlength="64">
                    </div>
                    <div class="auth-row">
                        <button id="login-btn" type="button" class="wide">登录</button>
                    </div>
                </div>

                <div id="register-pane" hidden>
                    <div class="auth-row">
                        <input id="reg-email" type="email" inputmode="email" autocomplete="email"
                               placeholder="邮箱" maxlength="120">
                        <button id="send-btn" type="button">获取验证码</button>
                    </div>
                    <div class="auth-row">
                        <input id="code-input" type="text" inputmode="numeric" autocomplete="one-time-code"
                               placeholder="验证码" maxlength="8">
                    </div>
                    <div class="auth-row">
                        <input id="reg-password" type="password" autocomplete="new-password"
                               placeholder="设置密码（至少 6 位）" maxlength="64">
                    </div>
                    <div class="auth-row">
                        <input id="reg-nick" type="text" autocomplete="nickname"
                               placeholder="昵称（注册后不可修改）" maxlength="20">
                    </div>
                    <div class="auth-row">
                        <button id="register-btn" type="button" class="wide">注册</button>
                    </div>
                </div>
            </div>

            <p class="auth-tip" id="auth-tip">登录或注册后，评论会带上「已验证」标记。</p>
        </div>

        <div id="tcomment"></div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const episodesContainer = document.getElementById('episodes-container');
            const videoPlayer = document.getElementById('video-player');
            const errorOverlay = document.getElementById('error-overlay');
            const errorText = document.getElementById('error-text');
            const videoTitleArea = document.getElementById('video-title-area');
            const videoTitleText = document.getElementById('video-title-text');

            let videoList = [];

            // ==========================================
            // 1. 读取 JSON 列表
            // ==========================================
            async function fetchVideoList() {
                try {
                    const response = await fetch('./yskbl/list.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    if (!Array.isArray(data) || data.length === 0) {
                        throw new Error('JSON格式错误：必须是非空数组');
                    }

                    videoList = data;
                    renderEpisodeButtons();
                } catch (err) {
                    console.error("读取 list.json 失败:", err);
                    episodesContainer.innerHTML = '<div class="scanning-text" style="color: #d64545;">无法加载视频列表，请确保 yskbl 文件夹下有正确的 list.json。</div>';
                }
            }

            // ==========================================
            // 2. 智能解析文件名与渲染
            // ==========================================
            function parseFilename(filename) {
                const nameWithoutExt = filename.replace(/\.[^.]+$/, '');
                if (nameWithoutExt.includes('.')) {
                    const parts = nameWithoutExt.split('.');
                    let buttonText = parts[0];
                    const videoTitle = parts.slice(1).join('.');
                    if (/^\d+$/.test(buttonText)) buttonText = `第 ${buttonText} 集`;
                    return { buttonText, videoTitle, order: '' };
                }
                return { buttonText: nameWithoutExt, videoTitle: '', order: '' };
            }

            function renderEpisodeButtons() {
                episodesContainer.innerHTML = '';

                videoList.forEach((filename, idx) => {
                    const info = parseFilename(filename);
                    info.order = String(idx + 1);   // 集号 = 在 list.json 里的顺序

                    const btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.textContent = info.buttonText;
                    btn.style.animationDelay = `${Math.min(idx * 0.05, 1)}s`;

                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        loadEpisode(filename, info.videoTitle);
                        showEpisodeComments(info);
                    });

                    episodesContainer.appendChild(btn);
                });

                if (videoList.length > 0) {
                    const firstInfo = parseFilename(videoList[0]);
                    firstInfo.order = '1';
                    const firstBtn = episodesContainer.querySelector('.ep-btn');
                    if (firstBtn) firstBtn.classList.add('active');
                    loadEpisode(videoList[0], firstInfo.videoTitle || '');
                    showEpisodeComments(firstInfo);
                }
            }

            // 通知评论区切换到某一集（评论区脚本若还没准备好会自行记住）
            // 集号用列表顺序 order，与文件名无关，改名也不会丢评论
            function showEpisodeComments(info) {
                const payload = { order: info.order, label: info.buttonText };
                if (window.YSKBL && typeof window.YSKBL.setEpisode === 'function') {
                    window.YSKBL.setEpisode(payload.order, payload.label);
                } else {
                    window.__yskblPendingEpisode__ = payload;
                }
            }

            // ==========================================
            // 3. 加载并播放（16 分片并发下载，先下完的先拼接可播）
            // ==========================================
            // 分片策略：
            //   · 文件切成 16 块，同一时刻 16 个请求全部并发（吃满带宽）
            //   · 每块下完立刻并入播放栅格，能播就立刻换源，不用等全部下完
            //   · 单块失败延迟 1 秒重试，最多 3 次
            const SPARK_CHUNKS = 16;      // 分片总数
            const SPARK_CONCURRENCY = 16; // 并发上限（= 分片数，即全部并发）
            const SPARK_RETRY = 3;        // 重试次数
            const SPARK_MSSIZE = 1 << 20; // 播放栅格粒度 1MB
            const STREAM_GROW = 6 << 20;  // 可播范围每增长 6MB 才换一次源（换源会打断播放）

            const dlBar = document.getElementById('dl-bar');
            const dlFill = document.getElementById('dl-bar-fill');
            const dlPlayFill = document.getElementById('dl-bar-play');
            const dlText = document.getElementById('dl-bar-text');
            const dlSpeed = document.getElementById('dl-bar-speed');

            let curJob = null;      // 当前下载任务（切集时用来中断）
            let curObjectUrl = '';  // 当前 blob URL，换集时要 revoke

            function fmtBytes(n) {
                if (!n || n < 0) return '0 B';
                const u = ['B', 'KB', 'MB', 'GB'];
                let i = 0;
                while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
                return (i === 0 ? n : n.toFixed(n < 10 ? 2 : 1)) + ' ' + u[i];
            }

            function showBar() { if (dlBar) { dlBar.hidden = false; dlBar.className = 'dl-bar'; } }
            function hideBar() { if (dlBar) dlBar.hidden = true; }

            function paintBar(got, total, speed, playable) {
                if (!dlBar) return;
                const pct = total ? Math.min(100, (got / total) * 100) : 0;
                if (dlFill) dlFill.style.width = pct.toFixed(2) + '%';
                // 可播进度叠在下载进度上，一眼看出「下载到哪」和「能播到哪」
                if (dlPlayFill) {
                    const pp = total && playable ? Math.min(100, (playable / total) * 100) : 0;
                    dlPlayFill.style.width = pp.toFixed(2) + '%';
                }
                if (dlText) {
                    var s = `${pct.toFixed(1)}%  ${fmtBytes(got)} / ${fmtBytes(total)}`;
                    if (playable > 0 && playable < got) s += `  ·  可播 ${fmtBytes(playable)}`;
                    dlText.textContent = s;
                }
                if (dlSpeed) dlSpeed.textContent = speed ? speed : '';
            }

            // 一次 Range 请求；失败返回 null 由上层重试
            async function fetchChunk(job, index, start, end) {
                const len = end - start + 1;
                let lastErr = null;
                for (let attempt = 0; attempt <= SPARK_RETRY; attempt++) {
                    if (job.aborted) return null;
                    if (attempt > 0) await new Promise(r => setTimeout(r, 1000));
                    if (job.aborted) return null;
                    const ctrl = new AbortController();
                    job.controllers.add(ctrl);
                    try {
                        const res = await fetch(job.url, {
                            headers: { Range: `bytes=${start}-${end}` },
                            signal: ctrl.signal,
                            cache: 'default',
                        });
                        if (res.status !== 206) {
                            // 206 才是标准分段响应；200 说明整包下发了，别浪费流量
                            throw new Error(`HTTP ${res.status}`);
                        }
                        const buf = await res.arrayBuffer();
                        if (buf.byteLength !== len) throw new Error(`长度不符 ${buf.byteLength}/${len}`);
                        return new Uint8Array(buf);
                    } catch (e) {
                        if (job.aborted) return null;
                        lastErr = e;
                        console.warn(`[分片 ${index + 1}] 第 ${attempt + 1} 次失败：`, e.message || e);
                    } finally {
                        job.controllers.delete(ctrl);
                    }
                }
                job.error = lastErr;
                return null;
            }

            // 把已下完的连续分片拼成 blob URL，尽量早地给出可播源
            function rebuildSource(job, force) {
                const ms = job.mssize;
                const readyUpTo = job.readyEnd; // 已连续覆盖到的字节（含）
                if (readyUpTo <= job.publishedEnd && !force) return;
                const endMs = Math.floor(readyUpTo / ms) + 1;
                if (!force && endMs <= job.publishedMs) return;

                const parts = [];
                let remain = job.total;
                for (let i = 0; i < endMs; i++) {
                    const cell = job.grid.get(i);
                    if (cell && cell.bytes) {
                        // 末尾那格只取到文件真实结尾，避免多出空白字节
                        const take = Math.min(cell.bytes.byteLength, remain, cell.have);
                        parts.push(cell.bytes.subarray(0, take));
                        remain -= take;
                    } else {
                        parts.push(new Uint8Array(0)); // 理论上不会走到，防御一下
                    }
                }
                const blob = new Blob(parts, { type: job.mime });
                const url = URL.createObjectURL(blob);
                const old = curObjectUrl;
                curObjectUrl = url;
                job.phase = 'stream';   // 已进入边下边播阶段，换源 error 不计入失败
                job.errCount = 0;
                const t = videoPlayer.currentTime;
                const wasPlaying = !videoPlayer.paused && t > 0;
                videoPlayer.src = url;
                videoPlayer.load();
                if (t > 0) videoPlayer.addEventListener('loadedmetadata', () => {
                    try { videoPlayer.currentTime = t; } catch (e) {}
                    if (wasPlaying) videoPlayer.play().catch(() => {});
                }, { once: true });
                if (old) setTimeout(() => URL.revokeObjectURL(old), 30000);
                job.publishedMs = endMs;
                job.publishedEnd = readyUpTo;
            }

            // 用连续覆盖的前缀推进 readyEnd：只有当整格确实写满时才算可播
            function advanceReady(job) {
                const ms = job.mssize;
                const total = job.total;
                let idx = Math.floor((job.readyEnd + 1) / ms);
                while (idx * ms < total) {
                    const cell = job.grid.get(idx);
                    if (!cell || !cell.bytes) break;
                    const want = Math.min(ms, total - idx * ms);
                    if (cell.have < want) break; // 这格还没填满，不能算可播
                    job.readyEnd = Math.min(total - 1, (idx + 1) * ms - 1);
                    idx++;
                }
            }

            async function startStream(filename, job) {
                job.controllers = new Set();
                job.grid = new Map();
                job.mssize = SPARK_MSSIZE;
                job.publishedMs = 0;
                job.publishedEnd = -1;
                job.readyEnd = -1;
                job.url = `./yskbl/${encodeURIComponent(filename)}`;

                // 1) 先拿文件总大小，并确认服务端支持 Range
                let head;
                try {
                    head = await fetch(job.url, { method: 'HEAD', cache: 'default' });
                } catch (e) {
                    head = null;
                }
                if (!head || !head.ok) {
                    // 有的 CDN 不支持 HEAD，退回普通 GET 的首个分段
                    throw new Error('无法获取视频信息');
                }
                const total = parseInt(head.headers.get('content-length') || '0', 10);
                const accepts = (head.headers.get('accept-ranges') || '').toLowerCase();
                const mime = head.headers.get('content-type') || 'video/mp4';
                if (!total || (accepts && accepts !== 'bytes')) {
                    throw new Error(accepts && accepts !== 'bytes' ? '服务端不支持分段下载' : '文件大小为 0');
                }
                job.total = total;
                job.mime = mime;

                // 2) 均分成 16 块
                const n = SPARK_CHUNKS;
                const base = Math.floor(total / n);
                const chunks = [];
                for (let i = 0; i < n; i++) {
                    const s = i * base;
                    const e = i === n - 1 ? total - 1 : s + base - 1;
                    if (s <= e) chunks.push({ index: i, start: s, end: e, len: e - s + 1 });
                }

                // 3) 并发池：16 块全部同时发，谁完成就拉下一个（重试也走这个池）
                let done = 0;
                let gotBytes = 0;
                showBar();
                paintBar(0, total, '');

                const t0 = performance.now();
                let cursor = 0;
                async function worker() {
                    while (cursor < chunks.length && !job.aborted) {
                        const c = chunks[cursor++];
                        const buf = await fetchChunk(job, c.index, c.start, c.end);
                        if (job.aborted) return;
                        if (!buf) return; // 重试耗尽，job.error 已记下
                        // 写入播放栅格：按字节绝对位置落盘，跨片也不会错位
                        const ms = job.mssize;
                        for (let p = c.start; p <= c.end; ) {
                            const g = Math.floor(p / ms);
                            const gEnd = Math.min(c.end, (g + 1) * ms - 1);
                            const lo = g * ms;
                            let cell = job.grid.get(g);
                            if (!cell) {
                                cell = { bytes: new Uint8Array(Math.min(ms, job.total - lo)), have: 0 };
                                job.grid.set(g, cell);
                            }
                            const src = buf.subarray(p - c.start, p - c.start + (gEnd - p + 1));
                            cell.bytes.set(src, p - lo);
                            cell.have = Math.max(cell.have, gEnd - lo + 1);
                            p = gEnd + 1;
                        }
                        done++;
                        gotBytes += c.len;
                        // 进度
                        const secs = (performance.now() - t0) / 1000;
                        const speed = secs > 0.3 ? fmtBytes(gotBytes / secs) + '/s' : '';
                        paintBar(gotBytes, total, speed, job.readyEnd + 1);
                        // 先下完的前缀尽早可播：只在「可播范围明显变长」时才换源，
                        // 频繁换源会不停打断播放（每次 load 都要重新解码）
                        advanceReady(job);
                        if (job.readyEnd >= 0) {
                            const needMs = Math.floor(job.readyEnd / job.mssize) + 1;
                            const grown = (needMs - job.publishedMs) * job.mssize;
                            if (job.publishedMs === 0 || done === chunks.length || grown >= STREAM_GROW) {
                                rebuildSource(job, done === chunks.length);
                            }
                        }
                    }
                }
                const pool = [];
                for (let i = 0; i < Math.min(SPARK_CONCURRENCY, chunks.length); i++) pool.push(worker());
                await Promise.all(pool);

                if (job.aborted) return;
                if (job.error) throw job.error;
                // 全部完成，强制拼一次完整源（此时再换源不会再有断流）
                rebuildSource(job, true);
                if (dlBar) dlBar.classList.add('done');
                if (dlText) dlText.textContent = `已就绪  ${fmtBytes(total)}`;
                if (dlSpeed) dlSpeed.textContent = '';
                setTimeout(hideBar, 2500);
            }

            function abortJob(job) {
                if (!job || job.aborted) return;
                job.aborted = true;
                job.controllers.forEach(c => { try { c.abort(); } catch (e) {} });
                job.controllers.clear();
            }

            function loadEpisode(filename, title) {
                errorOverlay.style.display = 'none';
                videoPlayer.style.display = 'block';

                // 切集：把上一集的下载任务全部掐掉，别抢带宽
                abortJob(curJob);
                const job = { aborted: false, phase: 'probe', errCount: 0 };
                curJob = job;

                videoPlayer.onerror = () => {
                    // 下载/换源过程中出现的 error 大多是换源引起的，不能当成「文件缺失」
                    if (job.aborted) return;
                    job.errCount++;
                    console.warn(`[播放器 error] 阶段=${job.phase} 第 ${job.errCount} 次`);
                    // 只有「探测/直链播放」阶段连续出错、且没有可用源，才算真的缺失
                    if (job.phase === 'direct' && job.errCount >= 2 && !videoPlayer.src.startsWith('blob:')) {
                        failEpisode(filename);
                    }
                };

                if (title && title.trim() !== '') {
                    videoTitleText.textContent = title;
                    videoTitleArea.classList.add('show');
                } else {
                    videoTitleArea.classList.remove('show');
                }

                showBar();
                paintBar(0, 0, '');
                if (dlText) dlText.textContent = '正在探测文件大小…';

                startStream(filename, job).catch(err => {
                    if (job.aborted) return;
                    console.warn('[分段下载失败]', err && err.message);
                    if (dlBar) { dlBar.classList.add('fail'); }
                    if (dlText) dlText.textContent = '分段下载失败：' + ((err && err.message) || '未知错误');
                    if (dlSpeed) dlSpeed.textContent = '';
                    // 分片路线失败时退回原生直链，至少还能看（但没法边下边播）
                    job.phase = 'direct';
                    job.errCount = 0;
                    const direct = job.url || `./yskbl/${encodeURIComponent(filename)}`;
                    videoPlayer.src = direct;
                    videoPlayer.load();
                    videoPlayer.play().catch(() => {});
                });
            }

            function failEpisode(filename) {
                videoPlayer.style.display = 'none';
                errorOverlay.style.display = 'flex';
                errorText.innerHTML = `本集内容缺失<br><span style="font-size: 0.85rem; color: #ffd166; margin-top: 8px; display: inline-block; word-break: break-all;">网页尝试寻找：<br>yskbl/${filename}</span><br><span style="font-size: 0.8rem; color: #8fa1b8; margin-top: 4px; display: inline-block;">请检查文件是否存在且大小写一致</span>`;
            }

            fetchVideoList();
        });
    </script>

    <script>
        // ==========================================

        // 与 index.html 的留言板（path 默认为 /）也互不干扰。
        // ==========================================
        (function () {
            var ENV_ID = 'https://twikoo.btzx2027class3.dpdns.org';
            var RENDER_KEY = '__yskbl_comment_path__';
            // jsdelivr 偶尔 502 / 被拦截，准备了多个镜像顺序尝试

            function postJSON(url, payload, cb) {

            function nickForEmail(email) {

            function resolveNick(data, email, candidates) {
                var fromApi = (data && (data.nick || data.nickname || (data.data && (data.data.nick || data.data.nickname)))) || '';
                fromApi = String(fromApi).trim();

            // 账号指纹：正文里夹一个肉眼看不见的 <span data-agent="a1+sha256(邮箱)">…</span>

                        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                        hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
                        k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
                    }
                }
                var words = [], bitLen = ascii.length * 8;
                ascii += '\x80';
                while (ascii.length % 64 - 56) ascii += '\x00';
                for (i = 0; i < ascii.length; i++) {
                    j = ascii.charCodeAt(i);
                    if (j >> 8) return '';
                    words[i >> 2] |= j << ((3 - i) % 4) * 8;
                }
                words[words.length] = (bitLen / maxWord) | 0;
                words[words.length] = bitLen;
                for (j = 0; j < words.length;) {
                    var w = words.slice(j, j += 16);
                    var oldHash = hash;
                    hash = hash.slice(0, 8);
                    for (i = 0; i < 64; i++) {
                        var w15 = w[i - 15], w2 = w[i - 2];
                        var a = hash[0], e = hash[4];
                        var temp1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (
                            w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))
                        ) | 0);
                        var temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                        hash = [(temp1 + temp2) | 0].concat(hash);
                        hash[4] = (hash[4] + temp1) | 0;
                    }
                    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
                }
                for (i = 0; i < 8; i++) {
                    for (j = 3; j + 1; j--) {
                        var b = (hash[i] >> (j * 8)) & 255;
                        result += ((b < 16) ? 0 : '') + b.toString(16);
                    }
                }
                return result;
            }
            function agentId(email) {
                email = String(email || '').trim().toLowerCase();
                if (!email || email.indexOf('@') < 0) return '';
                var h = sha256Hex(email);
                return h ? 'a1' + h : '';
            }
            function readAgent(comment) {
                var m = String(comment == null ? '' : comment).match(/data-agent="([0-9a-z]+)"/);
                return m ? m[1] : '';
            }
            function wrapAgent(html, id) {
                return id ? '<span data-agent="' + id + '">' + html + '</span>' : html;
            }
            function stripAgent(html) {
                var s = String(html || ''), out = '', i = 0;
                var OPEN = /<span data-agent="[0-9a-z]+">/g;
                var m;
                while ((m = OPEN.exec(s)) !== null) {
                    out += s.slice(i, m.index);
                    var depth = 1, p = OPEN.lastIndex;
                    var TAG = /<(\/?)span\b[^>]*>/gi;
                    TAG.lastIndex = p;
                    var t, end = -1;
                    while ((t = TAG.exec(s)) !== null) {
                        depth += t[1] ? -1 : 1;
                        if (depth === 0) { end = t.index; p = TAG.lastIndex; break; }
                    }
                    if (end < 0) { out += s.slice(m.index); i = s.length; break; }
                    out += s.slice(OPEN.lastIndex, end);
                    i = p;
                    OPEN.lastIndex = p;
                }
                return out + s.slice(i);
            }

            function applyAuthState() {
                var verified = !!auth.token;
                setStatus(verified ? '✅ 已登录 (' + (auth.email || '') + ')' : '当前：游客',
                    verified ? 'verified' : 'guest');
                if ($('auth-guest')) $('auth-guest').hidden = verified;
                if ($('auth-user')) $('auth-user').hidden = !verified;
                if (!verified) closeNickEditor();

                var tip = $('auth-tip');
                if (tip) {
                    tip.textContent = verified
                        ? '已登录：' + (auth.email || '') + '（昵称 ' + accountNick() + '），你的评论会带「已验证」标记。'
                        : '登录或注册后，评论会带上「已验证」标记。';
                }
                if (!verified) resetSendButton();
                // 登录态变了：重画当前集的评论徽章 + 评论表单
                if (ready && currentPath) renderEpisode(currentPath, currentLabel);
            }

            function resetSendButton() {
                clearInterval(sendTimer); sendTimer = null;
                var btn = $('send-btn');
                if (btn) { btn.textContent = '获取验证码'; btn.disabled = false; }
            }

            function switchTab(which) {
                var isLogin = which !== 'register';
                if ($('login-pane')) $('login-pane').hidden = !isLogin;
                if ($('register-pane')) $('register-pane').hidden = isLogin;
                if ($('tab-login')) $('tab-login').className = 'tab' + (isLogin ? ' is-active' : '');
                if ($('tab-register')) $('tab-register').className = 'tab' + (isLogin ? '' : ' is-active');
                var tip = $('auth-tip');
                if (tip) tip.textContent = isLogin
                    ? '用注册时的邮箱和密码登录。'
                    : '填写邮箱 → 获取验证码 → 设置密码，完成注册。';
            }

            function login() {
                var emailEl = $('login-email'), pwdEl = $('login-password'), btn = $('login-btn');
                var email = (emailEl.value || '').trim();
                var password = pwdEl.value || '';
                if (!email) { setStatus('请填写邮箱', 'error'); emailEl.focus(); return; }
                if (!isEmail(email)) { setStatus('邮箱格式不对', 'error'); emailEl.focus(); return; }
                if (!password) { setStatus('请填写密码', 'error'); pwdEl.focus(); return; }

                btn.disabled = true;
                setStatus('正在登录…', 'busy');
                // ua 是给后端做「新设备登录提醒」用的：服务端拿 IP，前端补设备信息
                postJSON(AUTH_API + '/api/login',
                    { email: email, password: password, ua: navigator.userAgent },
                    function (err, data) {
                    btn.disabled = false;
                    if (err || isFail(data)) {
                        setStatus('登录失败：' + ((err && err.message) || '请稍后再试'), 'error');
                        return;
                    }
                    var token = pickToken(data);
                    if (!token) { setStatus('登录失败：服务器没有返回 token', 'error'); return; }
                    auth.token = String(token);
                    auth.email = email;
                    auth.nick = resolveNick(data, email, [readStore(NICK_KEY)]);
                    writeStore(TOKEN_KEY, auth.token);
                    writeStore(EMAIL_KEY, email);
                    writeStore(NICK_KEY, auth.nick);
                    rememberNick(auth.nick, email);
                    applyAuthState();
                });
            }

            function sendCode() {
                var emailEl = $('reg-email'), btn = $('send-btn');
                var email = (emailEl.value || '').trim();
                if (!email) { setStatus('请先填写邮箱', 'error'); emailEl.focus(); return; }
                if (!isEmail(email)) { setStatus('邮箱格式不对', 'error'); emailEl.focus(); return; }

                btn.disabled = true;
                setStatus('正在发送…', 'busy');
                postJSON(AUTH_API + '/api/send-code', { email: email }, function (err, data) {
                    if (err || isFail(data)) {
                        setStatus((err && err.message) || '发送失败，请稍后再试', 'error');
                        btn.disabled = false;
                        return;
                    }
                    writeStore(EMAIL_KEY, email);
                    setStatus('验证码已发送，请查收邮箱', 'busy');
                    var left = 60;
                    btn.textContent = left + ' 秒后重发';
                    clearInterval(sendTimer);
                    sendTimer = setInterval(function () {
                        left--;
                        if (left <= 0) { resetSendButton(); return; }
                        btn.textContent = left + ' 秒后重发';
                    }, 1000);
                    if ($('code-input')) $('code-input').focus();
                });
            }

            function register() {
                var emailEl = $('reg-email'), codeEl = $('code-input'), pwdEl = $('reg-password');
                var nickEl = $('reg-nick'), btn = $('register-btn');
                var email = (emailEl.value || '').trim();
                var code = (codeEl.value || '').trim();
                var password = pwdEl.value || '';
                var nick = (nickEl.value || '').trim();

                if (!email) { setStatus('请填写邮箱', 'error'); emailEl.focus(); return; }
                if (!isEmail(email)) { setStatus('邮箱格式不对', 'error'); emailEl.focus(); return; }
                if (!code) { setStatus('请填写验证码', 'error'); codeEl.focus(); return; }
                if (!password) { setStatus('请设置密码', 'error'); pwdEl.focus(); return; }
                if (password.length < 6) { setStatus('密码至少 6 位', 'error'); pwdEl.focus(); return; }
                if (!nick) { setStatus('请填写昵称', 'error'); nickEl.focus(); return; }
                if (nick.length > 20) { setStatus('昵称最多 20 个字', 'error'); nickEl.focus(); return; }
                if (/[\[\]<>]/.test(nick)) {
                    setStatus('昵称不能包含 [ ] < > 这些符号', 'error'); nickEl.focus(); return;
                }
                if (nickTaken(nick)) {
                    setStatus('这个昵称已经被别人用了，换一个吧', 'error'); nickEl.focus(); return;
                }

                btn.disabled = true;
                setStatus('正在注册…', 'busy');
                postJSON(AUTH_API + '/api/register',
                    { email: email, code: code, password: password, nick: nick },
                    function (err, data) {
                        btn.disabled = false;
                        if (err || isFail(data)) {
                            setStatus('注册失败：' + ((err && err.message) || '请稍后再试'), 'error');
                            return;
                        }
                        var token = pickToken(data);
                        if (!token) { setStatus('注册失败：服务器没有返回 token', 'error'); return; }
                        auth.token = String(token);
                        auth.email = email;
                        auth.nick = nick || resolveNick(data, email, [readStore(NICK_KEY)]);
                        writeStore(TOKEN_KEY, auth.token);
                        writeStore(EMAIL_KEY, email);
                        writeStore(NICK_KEY, auth.nick);
                        rememberNick(auth.nick, email);
                        resetSendButton();
                        applyAuthState();
                    });
            }

            function signOut() {
                auth.token = '';
                auth.email = '';
                auth.nick = '';
                writeStore(TOKEN_KEY, '');
                writeStore(EMAIL_KEY, '');
                writeStore(NICK_KEY, '');
                closeNickEditor();
                applyAuthState();
                switchTab('login');
            }

            // ---------- 修改昵称 ----------
            // 账号后端没有改昵称的接口，昵称只存本地（邮箱 -> 昵称表 + class3_nick）
            function openNickEditor() {
                if (!auth.token) return;
                var pane = $('nick-pane'), btn = $('edit-nick-btn');
                if (!pane) return;
                pane.hidden = false;
                if (btn) btn.hidden = true;
                var input = $('nick-input');
                if (input) { input.value = accountNick(); input.focus(); input.select(); }
                var t = $('nick-tip');
                if (t) {
                    t.textContent = '改的是以后评论用的昵称，已发出去的旧评论不会改名。';
                    t.className = 'auth-tip';
                }
            }

            function closeNickEditor() {
                var pane = $('nick-pane'), btn = $('edit-nick-btn');
                if (pane) pane.hidden = true;
                if (btn) btn.hidden = false;
            }

            function saveNick() {
                var input = $('nick-input'), tip = $('nick-tip');
                var btn = $('nick-save-btn');
                function say(t, bad) {
                    if (!tip) return;
                    tip.textContent = t;
                    tip.className = 'auth-tip' + (bad ? ' nick-bad' : '');
                }
                var nick = (input && input.value || '').trim();
                if (!auth.token) return say('请先登录。', true);
                if (!nick) { say('昵称不能为空。', true); if (input) input.focus(); return; }
                if (nick.length > 20) { say('昵称最多 20 个字。', true); if (input) input.focus(); return; }
                if (/[\[\]<>]/.test(nick)) { say('昵称不能包含 [ ] < > 这几个符号。', true); if (input) input.focus(); return; }
                if (nickTaken(nick)) { say('这个昵称已经被别的邮箱用了。', true); if (input) input.focus(); return; }
                if (nick === accountNick()) { closeNickEditor(); return; }

                // 昵称存后端（users.nick），换设备登录也能拿到同一个
                if (btn) btn.disabled = true;
                say('正在保存…', false);
                postJSON(AUTH_API + '/api/set-nick', { token: auth.token, nick: nick }, function (err, data) {
                    if (btn) btn.disabled = false;
                    if (err || isFail(data)) {
                        var m = (err && err.message) || '保存失败，请稍后再试';
                        if (/过期|缺少token|登录/.test(m)) { signOut(); return; }
                        say(m, true);
                        return;
                    }
                    auth.nick = nick;
                    writeStore(NICK_KEY, nick);
                    rememberNick(nick, auth.email);
                    var aid = agentId(auth.email);
                    if (aid) rememberAgent(nick, auth.email);
                    closeNickEditor();
                    applyAuthState();
                    setStatus('✅ 已登录 (' + (auth.email || '') + ')', 'verified');
                    if (tip) tip.textContent = '昵称已改为 ' + nick + '。';
                    // 昵称变了，评论列表里的「已验证」判定要重算
                    if (ready && currentPath) renderEpisode(currentPath, currentLabel);
                });
            }

            // 启动时校验本地 token（与首页共用，所以首页登录过这里直接是已登录）
            function checkToken() {
                var token = readStore(TOKEN_KEY);
                auth.nick = readStore(NICK_KEY);
                if (!token) { auth.token = ''; auth.email = ''; applyAuthState(); return; }
                auth.token = token;
                auth.email = readStore(EMAIL_KEY);
                setStatus('正在校验登录状态…', 'busy');
                postJSON(AUTH_API + '/api/check-token', { token: token }, function (err, data) {
                    if (err || isFail(data)) {
                        auth.token = ''; auth.email = ''; auth.nick = '';
                        writeStore(TOKEN_KEY, '');
                        applyAuthState();
                        return;
                    }
                    var email = data.email || (data.data && data.data.email) || readStore(EMAIL_KEY) || '';
                    auth.email = email;
                    if (email) writeStore(EMAIL_KEY, email);
                    // 后端常常不返昵称，不能拿邮箱前缀把本地记着的正确昵称冲掉
                    var nick = resolveNick(data, email, [auth.nick, readStore(NICK_KEY)]);
                    auth.nick = nick;
                    writeStore(NICK_KEY, nick);
                    rememberNick(nick, email);
                    applyAuthState();
                });
            }

            function bindAuth() {
                if ($('tab-login')) $('tab-login').addEventListener('click', function () { switchTab('login'); });
                if ($('tab-register')) $('tab-register').addEventListener('click', function () { switchTab('register'); });
                if ($('login-btn')) $('login-btn').addEventListener('click', login);
                if ($('login-password')) $('login-password').addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') login();
                });
                if ($('send-btn')) $('send-btn').addEventListener('click', sendCode);
                if ($('register-btn')) $('register-btn').addEventListener('click', register);
                if ($('reg-password')) $('reg-password').addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') { if ($('reg-nick')) $('reg-nick').focus(); else register(); }
                });
                if ($('reg-nick')) $('reg-nick').addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') register();
                });
                if ($('code-input')) $('code-input').addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' && $('reg-password')) $('reg-password').focus();
                });
                if ($('signout-btn')) $('signout-btn').addEventListener('click', signOut);
                if ($('edit-nick-btn')) $('edit-nick-btn').addEventListener('click', openNickEditor);
                if ($('nick-save-btn')) $('nick-save-btn').addEventListener('click', saveNick);
                if ($('nick-cancel-btn')) $('nick-cancel-btn').addEventListener('click', closeNickEditor);
                if ($('nick-input')) $('nick-input').addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') saveNick();
                    if (e.key === 'Escape') closeNickEditor();
                });
                switchTab('login');
                applyAuthState();
                checkToken();
            }

            function commentBox() {
                return document.getElementById('tcomment');
            }

            // 评论表单的固定位置：就在评论列表上方（#ep-slot 在 DOM 里排在 #tcomment 之前）
            function formSlot() {
                return document.getElementById('ep-slot') || commentBox();
            }

            function showMsg(text, isError) {
                var el = commentBox();
                if (!el) return;
                var color = isError ? '#d64545' : 'var(--ink-soft, #55637c)';
                el.innerHTML = '<p style="color:' + color + ';text-align:center;line-height:1.8;">' + text + '</p>';
            }

            // 每集一个独立 path：/yskbl/<集号>
            // 集号 = 在 list.json 里的位置（第 1 个元素就是 1），与文件名无关，
            // 所以改标题、改文件名都不会让已有评论“搬家”。
            function episodePath(order) {
                return '/yskbl/' + String(order);
            }

            // 真正渲染某一集的评论
            function renderEpisode(path, label) {
                pending = { path: path, label: label };
                // 页面刷新时，Twikoo 可能从 localStorage 里恢复上一次的评论，
                // 这里按 path 独立记录“最后渲染过的集”，避免恢复出错集的评论
                try { localStorage.setItem(RENDER_KEY, path + '|' + (label || '')); } catch (e) {}

                // 无论在等待还是渲染，都先把集数打在评论区上方，便于确认切换生效
                var titleEl = document.getElementById('comment-ep');
                if (titleEl) titleEl.textContent = label ? '当前：' + label : '';

                if (!ready || typeof twikoo === 'undefined') return;

                var el = commentBox();
                if (!el) return;
                // 容器在加载中显示文案时 innerHTML 有内容，这里统一清空
                el.innerHTML = '';
                ++renderSeq;
                currentPath = path;
                currentLabel = label || '';

                // 评论正文统一按“换行 = <br>”渲染，避免把整段当纯文本
                // 每条评论只保留一层容器，不再往 #tcomment 里塞额外结构
                renderCommentList(path, label);
            }

            // 时间：Twikoo 老版本返回毫秒时间戳字符串，新版本返回 ISO 日期字符串
            function formatTime(v) {
                if (!v) return '';
                var d = /^\d+$/.test(String(v)) ? new Date(Number(v)) : new Date(String(v));
                if (isNaN(d.getTime())) return String(v);
                function p(n) { return n < 10 ? '0' + n : '' + n; }
                return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
            }

            // 正文：评论内容在库里是 HTML（Twikoo 自带 <p>、<br>、<em> 等），
            // 这里做「白名单」清洗：只保留少量行内标签，其余全部转成纯文本，
            // 既不显示 <p> 这类源码，也不会执行脚本。
            var ALLOWED_INLINE = {
                B: 1, STRONG: 1, EM: 1, I: 1, U: 1, S: 1, DEL: 1, CODE: 1, SPAN: 1,
                A: 1, SUB: 1, SUP: 1, BR: 1
            };
            function sanitizeNode(node, out) {
                var kids = node.childNodes || [];
                for (var i = 0; i < kids.length; i++) {
                    var k = kids[i];
                    if (k.nodeType === 3) {              // 文本节点
                        out.push(escText(k.nodeValue));
                    } else if (k.nodeType === 1) {       // 元素节点
                        var tag = String(k.nodeName || '').toUpperCase();
                        if (tag === 'BR') { out.push('<br>'); continue; }
                        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'IFRAME') continue;
                        if (ALLOWED_INLINE[tag]) {
                            var name = tag.toLowerCase();
                            var agent = k.getAttribute && k.getAttribute('data-agent');
                            if (agent && /^[0-9a-z]+$/.test(agent)) {
                                // 账号指纹：保留成 data-agent 属性，渲染完成后由 stripAgent 剥掉
                                out.push('<span data-agent="' + agent + '">');
                                sanitizeNode(k, out);
                                out.push('</span>');
                                continue;
                            }
                            if (tag === 'A') {
                                var href = k.getAttribute && k.getAttribute('href');
                                // 只放行 http(s)；危险的 javascript: 链接丢标签、留文字
                                if (!/^https?:\/\/[^\s"'<>]+$/i.test(href || '')) {
                                    sanitizeNode(k, out);
                                    continue;
                                }
                                out.push('<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">');
                                sanitizeNode(k, out);
                                out.push('</a>');
                                continue;
                            }
                            out.push('<' + name + '>');
                            sanitizeNode(k, out);
                            out.push('</' + name + '>');
                        } else {
                            sanitizeNode(k, out);        // 块级标签（p/div/li…）丢标签、留内容
                        }
                    }
                }
                return out;
            }
            // 文本节点只需要转义 < 和 >（& 已经被解析器还原过，不能再转一次）
            function escText(s) {
                return String(s == null ? '' : s)
                    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
            function formatBody(s) {
                var raw = String(s || '');
                if (raw.indexOf('<') < 0) {
                    // 纯文本：只做转义和换行
                    return escText(raw).replace(/\r?\n/g, '<br>');
                }
                if (typeof document === 'undefined' || !document.createElement) {
                    return escText(raw);
                }
                try {
                    var box = document.createElement('div');
                    box.innerHTML = raw;              // 解析在游离节点里进行，不会加载图片/执行脚本
                    var parts = sanitizeNode(box, []);
                    return parts.join('').replace(/^(\s*(<br>)*)+|((<br>)*\s*)+$/g, '');
                } catch (e) {
                    return esc(raw);
                }
            }

            // ------------------------------------------
            // 读取评论：只用 GET_RECENT_COMMENTS（这个云函数版本必支持）
            // GET_COMMENTS 在本站后端返回 1001「请更新 Twikoo 云函数」，不可用
            // 返回的每一项都带 url 字段（就是 path），所以前端按 url 精确过滤
            // ------------------------------------------
            function fetchRecent(cb) {
                var body = JSON.stringify({
                    event: 'GET_RECENT_COMMENTS',
                    pageSize: 100,
                    includeReply: false,
                    envId: ENV_ID
                });
                var done = false;
                function finish(err, data) {
                    if (done) return;
                    done = true;
                    cb(err, data);
                }
                if (typeof fetch !== 'function') return finish(new Error('fetch unavailable'));
                try {
                    fetch(ENV_ID + '/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: body
                    }).then(function (r) { return r.json(); }).then(function (res) {
                        if (!res || (res.code && res.code !== 0)) return finish(res || new Error('empty'));
                        finish(null, res.data || []);
                    }).catch(function (e) { finish(e); });
                } catch (e) {
                    finish(e);
                }
            }

            // 取全站最近评论 → 只留 url 等于本集 path 的，按时间倒序
            function pickByPath(list, path) {
                return (list || []).filter(function (c) {
                    return c && (c.url === path || c.path === path);
                }).sort(function (a, b) {
                    return (Number(b.created) || 0) - (Number(a.created) || 0);
                });
            }

            function renderCommentList(path, label) {
                var el = commentBox();
                var wrap = document.createElement('div');
                wrap.className = 'ep-comments';
                if (label) wrap.setAttribute('data-tk-ep', label);
                wrap.innerHTML = '<p class="ep-empty">评论加载中…</p>';
                el.appendChild(wrap);

                var seq = renderSeq;

                fetchRecent(function (err, data) {
                    if (seq !== renderSeq) return; // 期间又切了别的集，丢弃旧结果
                    if (err) {
                        console.error('[Twikoo]', err);
                        wrap.innerHTML = '<p class="ep-empty">评论加载失败，请刷新重试。</p>';
                        buildForm(label);
                        return;
                    }
                    var items = pickByPath(data, path);
                    if (items.length === 0) {
                        wrap.innerHTML = '<p class="ep-empty">这一集还没有评论，做个第一个留言的人吧～</p>';
                        buildForm(label);
                        return;
                    }
                    // 只要有带指纹的评论，就认为新规矩生效，不再用昵称近似
                    var hasAgent = items.some(function (c) { return !!readAgent(c.comment); });
                    wrap.innerHTML = items.map(function (c) {
                        var name = esc(c.nick);
                        var verified = isVerifiedComment(c, hasAgent);
                        var badge = verified
                            ? '<span class="ep-badge ep-badge--verified">[已验证]</span>'
                            : (readAgent(c.comment) ? '' : '<span class="ep-badge ep-badge--guest">[旧游客]</span>');
                        return '<div class="ep-comment' + (c.isReply ? ' ep-comment-reply' : '') + '">' +
                            '<div class="ep-comment-head"><span><b>' + name + '</b>' + badge + '</span>' +
                            '<span>' + formatTime(c.created) + '</span></div>' +
                            '<div class="ep-comment-body">' + stripAgent(formatBody(c.comment)) + '</div></div>';
                    }).join('');
                    buildForm(label);
                });
            }

            // ------------------------------------------
            // 评论列表下方：发表评论表单（按当前集的 path 提交，需要先登录）
            // 读取走 GET_RECENT_COMMENTS（上面），写入走 postComment
            // ------------------------------------------
            function readStore(k) {
                try { return localStorage.getItem(k) || ''; } catch (e) { return ''; }
            }
            function writeStore(k, v) {
                try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {}
            }

            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function buildForm(label) {
                var slot = formSlot();
                // 表单只放在 #ep-slot 这一个地方；#tcomment 里万一有历史残留也一并清掉
                slot.querySelectorAll('.ep-form, .ep-lock').forEach(function (n) { n.remove(); });
                if (commentBox() && commentBox() !== slot) {
                    commentBox().querySelectorAll('.ep-form, .ep-lock').forEach(function (n) { n.remove(); });
                }

                // 没登录不让留言，这样「已验证」才有意义
                if (!auth.token) {
                    var lock = document.createElement('p');
                    lock.className = 'ep-empty ep-lock';
                    lock.innerHTML = '请先在上方登录或注册，登录后即可评论。';
                    slot.appendChild(lock);
                    return;
                }

                var box = document.createElement('div');
                box.className = 'ep-form';
                // 已登录：昵称 / 邮箱锁定成账号信息，避免冒用别人的昵称
                box.innerHTML =
                    '<div class="ep-form-row">' +
                        '<input class="ep-input" data-ep="nick" maxlength="20" readonly value="' + esc(accountNick()) + '">' +
                        '<input class="ep-input" data-ep="mail" maxlength="60" readonly value="' + esc(auth.email || '') + '">' +
                    '</div>' +
                    '<textarea class="ep-textarea" data-ep="text" rows="3" maxlength="500" placeholder="说点什么吧…"></textarea>' +
                    '<div class="ep-form-foot">' +
                        '<span class="ep-msg" data-ep="msg"></span>' +
                        '<button class="ep-submit" data-ep="submit" type="button">发表评论</button>' +
                    '</div>';
                slot.appendChild(box);
                // 表单要先追加到页面里，才能用 querySelector 取到子元素
                var btn = box.querySelector('[data-ep="submit"]');
                if (btn) btn.addEventListener('click', function () {
                    submitEpisodeComment(box, btn);
                });
                return box;
            }

            // ------------------------------------------
            // 发表评论：Twikoo 1.6.x 的浏览器包里没有 submitComment，
            // 所以自己 POST COMMENT_SUBMIT（和组件内部发的是同一个事件）
            // ------------------------------------------
            function postComment(payload, cb) {
                var done = false;
                function finish(err, data) {
                    if (done) return;
                    done = true;
                    cb(err, data);
                }
                if (typeof fetch !== 'function') return finish(new Error('fetch unavailable'));
                fetch(ENV_ID + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(function (r) { return r.json(); }).then(function (res) {
                    if (!res || (res.code && res.code !== 0)) {
                        var e = new Error((res && res.message) || 'submit failed');
                        e.code = res && res.code;
                        return finish(e);
                    }
                    finish(null, res);
                }).catch(function (e) { finish(e); });
            }

            function submitEpisodeComment(box, btn) {
                function pick(name) { return box.querySelector('[data-ep="' + name + '"]'); }
                var text = (pick('text').value || '').trim();
                var msg = pick('msg');
                function say(t, bad) {
                    msg.textContent = t;
                    msg.className = 'ep-msg' + (bad ? ' bad' : '');
                }
                if (!auth.token) return say('请先登录再评论。', true);
                var nick = accountNick();
                var mail = auth.email || '';
                if (!nick) return say('账号昵称缺失，请重新登录。', true);
                if (!text) return say('评论内容不能为空。', true);

                btn.disabled = true;
                say('发表中…', false);
                // 正文夹隐形指纹，下次渲染就能认出这条是谁发的
                var aid = agentId(auth.email);
                var payload = {
                    event: 'COMMENT_SUBMIT',
                    envId: ENV_ID,
                    path: currentPath,
                    url: currentPath,
                    href: location.href,
                    nick: nick,
                    mail: mail,
                    link: '',
                    ua: navigator.userAgent,
                    comment: wrapAgent(escText(text).replace(/\r?\n/g, '<br>'), aid),
                    pid: '',
                    rid: ''
                };
                if (auth.token) payload.token = auth.token;

                postComment(payload, function (err) {
                    if (err) {
                        console.error('[Twikoo]', err);
                        var code = err.code !== undefined && err.code !== null ? err.code : '';
                        say('发表失败' + (code !== '' ? '（' + code + '）' : '') + '：' + (err.message || '网络错误'), true);
                        btn.disabled = false;
                        return;
                    }
                    pick('text').value = '';
                    say('发表成功！', false);
                    btn.disabled = false;
                    // 刷新列表（重新拉一次，新评论才会出现）
                    renderEpisode(currentPath, currentLabel);
                });
            }

            function loadScript(i) {
                if (i >= CDN_LIST.length) return showMsg('评论区加载失败，请刷新页面重试。', true);
                var s = document.createElement('script');
                s.src = CDN_LIST[i];
                s.onload = function () {
                    if (typeof twikoo === 'undefined') return loadScript(i + 1);
                    boot();
                };
                s.onerror = function () {
                    console.warn('[Twikoo] CDN 加载失败，换下一个：' + CDN_LIST[i]);
                    loadScript(i + 1);
                };
                document.body.appendChild(s);
            }

            // Twikoo 脚本就绪后：如果已经有了“当前集”就渲染它，
            // 否则等播放器读完 list.json 再调度（下方 200ms 轮询兜底）
            function boot() {
                if (!ready) {
                    ready = true;
                    if (pending) renderEpisode(pending.path, pending.label);
                }
                if (pending) {
                    if (timer) { clearInterval(timer); timer = null; }
                } else if (!timer) {
                    var tries = 0;
                    timer = setInterval(function () {
                        if (pending) {
                            clearInterval(timer); timer = null;
                            renderEpisode(pending.path, pending.label);
                        } else if (++tries > 150) {
                            clearInterval(timer); timer = null;
                        }
                    }, 200);
                }
            }

            // 供上方播放器脚本调用：切换某集
            window.YSKBL = {
                setEpisode: function (epId, label) {
                    renderEpisode(episodePath(epId), label || '');
                }
            };

            // 播放器脚本可能比本脚本先执行，先把它的“当前集”接过来
            if (window.__yskblPendingEpisode__) {
                var pe = window.__yskblPendingEpisode__;
                pending = { path: episodePath(pe.order), label: pe.label || '' };
                try { localStorage.setItem(RENDER_KEY, pending.path + '|' + pending.label); } catch (e) {}
            }

            showMsg('评论区加载中…', false);
            if (document.body) {
                bindAuth();
                loadScript(0);
            } else {
                document.addEventListener('DOMContentLoaded', function () { bindAuth(); loadScript(0); });
            }
        })();
    </script>
</body>
</html>
