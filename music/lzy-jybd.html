<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲乙丙丁 - 播放器</title>
    <style>
        :root {
            --ink: #1a2b49;
            --ink-soft: #55637c;
            --accent-1: #5b8def;
            --accent-2: #8f7bf0;
            --paper: rgba(255, 255, 255, 0.72);
            --line: rgba(0, 20, 40, 0.08);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0; padding: 2rem 1rem 3rem; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #eef4ff 0%, #f7f2ff 45%, #f2fbff 100%);
            overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background:
                radial-gradient(circle at 12% 18%, rgba(91, 141, 239, 0.16), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(143, 123, 240, 0.16), transparent 44%);
        }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }
        .bg-orb {
            position: fixed; z-index: -1; border-radius: 50%; pointer-events: none;
            filter: blur(40px); opacity: 0.55; animation: orbDrift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 360px; height: 360px; top: -90px; left: -90px; background: radial-gradient(circle, rgba(91, 141, 239, 0.55), transparent 70%); }
        .orb-2 { width: 420px; height: 420px; bottom: -140px; right: -110px; background: radial-gradient(circle, rgba(143, 123, 240, 0.5), transparent 70%); animation-delay: -6s; }

        .player-container {
            width: 100%; max-width: 900px; min-height: 560px;
            display: flex; overflow: hidden;
            background: var(--paper); border-radius: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px -30px rgba(0, 20, 40, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardEnter { 0% { opacity: 0; transform: translateY(40px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .player-left {
            flex: 0 0 46%; padding: 3rem 2.5rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-right: 1px solid rgba(0, 0, 0, 0.06);
        }

        .album-art {
            position: relative; width: 210px; height: 210px; margin-bottom: 1.8rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 22px 40px -20px rgba(91, 141, 239, 0.95), inset 0 0 0 6px rgba(255, 255, 255, 0.35);
        }
        .album-art.playing { animation: spin 15s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .album-art::after {
            content: ""; width: 26%; height: 26%; border-radius: 50%;
            background: #f2f5ff; box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.18);
            position: relative; z-index: 0;
        }
        .album-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; z-index: 1; }

        .song-info { text-align: center; margin-bottom: 2rem; }
        .song-title {
            margin: 0 0 0.3rem; font-size: 1.55rem; font-weight: 800; letter-spacing: 0.02em;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .song-artist { font-size: 0.9rem; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.04em; }

        .controls { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
        .progress-container {
            width: 100%; display: flex; align-items: center; gap: 12px;
            font-size: 0.82rem; color: var(--ink-soft); font-weight: 600; font-variant-numeric: tabular-nums;
        }
        .progress-bar {
            flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
            background: rgba(91, 141, 239, 0.18); border-radius: 10px; outline: none; cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: var(--accent-1); cursor: pointer;
            box-shadow: 0 2px 8px rgba(91, 141, 239, 0.5); transition: transform 0.15s ease;
        }
        .progress-bar::-webkit-slider-thumb:hover { transform: scale(1.15); }
        .progress-bar::-moz-range-thumb { width: 16px; height: 16px; border: none; border-radius: 50%; background: var(--accent-1); cursor: pointer; }

        .play-btn {
            width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 16px 28px -14px rgba(91, 141, 239, 0.95);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .play-btn:hover { transform: scale(1.06); box-shadow: 0 20px 34px -14px rgba(91, 141, 239, 1); }
        .play-btn:active { transform: scale(0.96); }
        .play-btn svg { width: 26px; height: 26px; fill: #fff; }
        .play-btn .icon-pause { display: none; }
        .play-btn.playing .icon-play { display: none; }
        .play-btn.playing .icon-pause { display: block; }

        .player-right { flex: 1; padding: 2.5rem 2rem; display: flex; flex-direction: column; min-height: 0; }
        .lyrics-title {
            margin: 0 0 1.2rem; text-align: center; font-size: 0.8rem; font-weight: 600;
            letter-spacing: 0.14em; color: var(--ink-soft); text-transform: uppercase;
        }
        .lyrics-container {
            flex: 1; overflow-y: auto; overflow-x: hidden; text-align: center;
            scrollbar-width: none; -ms-overflow-style: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            padding: 35% 0;
        }
        .lyrics-container::-webkit-scrollbar { display: none; }
        .lyrics-list { display: flex; flex-direction: column; gap: 1.4rem; padding-bottom: 35%; }
        .lyric-line {
            font-size: 1.05rem; font-weight: 600; line-height: 1.5;
            color: rgba(85, 99, 124, 0.45); transition: color 0.3s ease, transform 0.3s ease, font-size 0.3s ease;
        }
        .lyric-line.active {
            font-size: 1.2rem; font-weight: 800;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            transform: scale(1.04);
        }

        @media (max-width: 768px) {
            .player-container { flex-direction: column; max-width: 460px; min-height: 0; border-radius: 2rem; }
            .player-left { flex: none; border-right: none; border-bottom: 1px solid rgba(0, 0, 0, 0.06); padding: 2.5rem 1.5rem; }
            .player-right { padding: 1.8rem 1.2rem; height: 380px; }
            .album-art { width: 170px; height: 170px; }
            .lyrics-container { padding: 28% 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="player-container">
        <audio id="audio-player" src="lzy-jybd.m4a" preload="metadata"></audio>

        <div class="player-left">
            <div class="album-art" id="album-art">
                <img src="lzy-cover.jpg" alt="LZY Cover" onerror="this.style.display='none'">
            </div>

            <div class="song-info">
                <div class="song-title">甲乙丙丁</div>
                <div class="song-artist">LZY</div>
            </div>

            <div class="controls">
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" class="progress-bar" id="progress-bar" value="0" min="0" max="100" step="0.1">
                    <span id="duration">0:00</span>
                </div>

                <button class="play-btn" id="play-btn">
                    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

        <div class="player-right">
            <div class="lyrics-title">滚动歌词</div>
            <div class="lyrics-container" id="lyrics-container">
                <div class="lyrics-list" id="lyrics-list"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audio-player');
            const playBtn = document.getElementById('play-btn');
            const albumArt = document.getElementById('album-art');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const lyricsList = document.getElementById('lyrics-list');

            const lyricsData = [
                { time: 0, text: "你我怎么两清" },
                { time: 3, text: "怎么两清" },
                { time: 6, text: "怎么做回甲乙丙丁~" }
            ];

            lyricsData.forEach((line, index) => {
                const p = document.createElement('div');
                p.className = 'lyric-line';
                p.textContent = line.text;
                p.dataset.time = line.time;
                p.dataset.index = index;
                lyricsList.appendChild(p);
            });

            const lyricElements = document.querySelectorAll('.lyric-line');
            let activeIndex = -1;

            function formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
                progressBar.max = audio.duration;
            });

            playBtn.addEventListener('click', () => {
                if (audio.paused) audio.play();
                else audio.pause();
            });

            audio.addEventListener('play', () => {
                playBtn.classList.add('playing');
                albumArt.classList.add('playing');
            });

            audio.addEventListener('pause', () => {
                playBtn.classList.remove('playing');
                albumArt.classList.remove('playing');
            });

            audio.addEventListener('timeupdate', () => {
                const currentTime = audio.currentTime;

                if (!isNaN(audio.duration)) {
                    progressBar.value = currentTime;
                    currentTimeEl.textContent = formatTime(currentTime);
                }

                updateLyrics(currentTime);
            });

            progressBar.addEventListener('input', () => {
                audio.currentTime = progressBar.value;
            });

            function updateLyrics(currentTime) {
                let newIndex = -1;
                for (let i = 0; i < lyricsData.length; i++) {
                    if (currentTime >= lyricsData[i].time) newIndex = i;
                    else break;
                }

                if (newIndex === -1 && currentTime > 0) newIndex = 0;

                if (newIndex !== activeIndex && newIndex !== -1) {
                    if (activeIndex !== -1 && lyricElements[activeIndex]) {
                        lyricElements[activeIndex].classList.remove('active');
                    }

                    activeIndex = newIndex;
                    const activeEl = lyricElements[activeIndex];
                    activeEl.classList.add('active');
                    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            audio.addEventListener('ended', () => {
                playBtn.classList.remove('playing');
                albumArt.classList.remove('playing');
                progressBar.value = 0;
                currentTimeEl.textContent = "0:00";
                if (activeIndex !== -1) {
                    lyricElements[activeIndex].classList.remove('active');
                    activeIndex = -1;
                }
            });
        });
    </script>
</body>
</html>
