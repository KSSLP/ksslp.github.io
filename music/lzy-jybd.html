<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲乙丙丁 - 播放器</title>
    <style>
        /* ---------- 基础重置 ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaf0f6;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        /* ---------- 播放器主容器 ---------- */
        .player-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            width: 100%;
            max-width: 900px;
            height: 600px;
            display: flex;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
            overflow: hidden;
            position: relative;
            z-index: 2;
            animation: cardEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardEnter {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- 左侧：封面与控制区 ---------- */
        .player-left {
            flex: 0 0 45%;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0));
        }

        .album-art {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #183e5c, #0d2740);
            box-shadow: 0 20px 35px -10px rgba(20, 45, 70, 0.5), inset 0 0 0 4px rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease;
        }
        
        .album-art.playing { animation: spin 15s linear infinite; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .album-art::after {
            content: ""; width: 30%; height: 30%; border-radius: 50%;
            background: #eaf0f6; box-shadow: inset 0 2px 8px rgba(0,0,0,0.2);
        }

        /* 完美适配的封面图片 */
        .album-art img {
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%;
            object-fit: cover; 
            border-radius: 50%; 
            z-index: 1;
        }

        .song-info { text-align: center; margin-bottom: 2rem; }
        .song-title { font-size: 1.6rem; font-weight: 800; color: #162b3c; margin-bottom: 0.3rem; letter-spacing: 0.02em; }
        .song-artist { font-size: 1rem; color: #607d8b; font-weight: 500; }

        .controls { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }

        .progress-container {
            width: 100%; display: flex; align-items: center; gap: 12px;
            font-size: 0.85rem; color: #607d8b; font-weight: 600; font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
            background: rgba(24, 62, 92, 0.15); border-radius: 10px; outline: none; cursor: pointer; position: relative;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #183e5c; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); transition: transform 0.1s;
        }
        
        .progress-bar::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .play-btn {
            width: 64px; height: 64px; border-radius: 50%; background: #183e5c; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 25px -8px rgba(20, 45, 70, 0.6), inset 0 -2px 0 rgba(0,0,0,0.2);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, box-shadow 0.3s;
        }

        .play-btn:hover { transform: scale(1.06); background: #0c2338; box-shadow: 0 20px 35px -8px rgba(10, 30, 50, 0.7); }
        .play-btn:active { transform: scale(0.95); }
        .play-btn svg { width: 28px; height: 28px; fill: white; transition: transform 0.2s ease; }

        .play-btn .icon-pause { display: none; }
        .play-btn.playing .icon-play { display: none; }
        .play-btn.playing .icon-pause { display: block; }

        /* ---------- 右侧：滚动歌词区 ---------- */
        .player-right {
            flex: 1; padding: 3rem 2rem; display: flex; flex-direction: column; position: relative;
        }

        .lyrics-title {
            font-size: 1rem; color: #607d8b; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.5rem; text-align: center;
        }

        .lyrics-container {
            flex: 1; overflow-y: auto; overflow-x: hidden; text-align: center; position: relative;
            scrollbar-width: none; -ms-overflow-style: none;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            padding: 40% 0;
        }

        .lyrics-container::-webkit-scrollbar { display: none; }

        .lyrics-list { display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 40%; }

        .lyric-line {
            font-size: 1.15rem; font-weight: 600; color: rgba(24, 62, 92, 0.35);
            transition: all 0.3s ease; line-height: 1.5; cursor: default;
        }

        .lyric-line.active {
            color: #183e5c; font-size: 1.35rem; transform: scale(1.05);
            text-shadow: 0 2px 10px rgba(24, 62, 92, 0.2); font-weight: 800;
        }

        /* ---------- 背景装饰光斑 ---------- */
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.2; z-index: 0; pointer-events: none; animation: orbDrift 18s infinite alternate ease-in-out; }
        .orb-1 { width: 400px; height: 400px; background: #7aa9da; top: -100px; left: -120px; animation-duration: 22s; }
        .orb-2 { width: 500px; height: 500px; background: #b2cfe8; bottom: -150px; right: -130px; animation-duration: 26s; animation-delay: -5s; }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }

        /* ---------- 小屏适配 ---------- */
        @media (max-width: 768px) {
            .player-container { flex-direction: column; height: auto; max-width: 450px; border-radius: 2rem; }
            .player-left { border-right: none; border-bottom: 1px solid rgba(0, 0, 0, 0.05); padding: 2.5rem 1.5rem; }
            .player-right { padding: 2rem 1.5rem; height: 400px; }
            .album-art { width: 180px; height: 180px; }
            .lyrics-container { padding: 30% 0; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="player-container">
        <!-- 音频路径需确认当前目录是否有此文件 -->
        <audio id="audio-player" src="lzy-jybd.m4a" preload="metadata"></audio>

        <div class="player-left">
            <div class="album-art" id="album-art">
                <!-- 修改了这里的 src，指向您的 LZY 专属封面 -->
                <img src="lzy-cover.jpg" alt="LZY Cover" onerror="this.style.display='none'">
            </div>
            
            <div class="song-info">
                <div class="song-title">甲乙丙丁</div>
                <div class="song-artist">LZY</div>
            </div>

            <div class="controls">
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" class="progress-bar" id="progress-bar" value="0" min="0" max="100" step="0.1">
                    <span id="duration">0:00</span>
                </div>

                <button class="play-btn" id="play-btn">
                    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

        <div class="player-right">
            <div class="lyrics-title">滚动歌词</div>
            <div class="lyrics-container" id="lyrics-container">
                <div class="lyrics-list" id="lyrics-list">
                    <!-- 歌词由 JS 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audio-player');
            const playBtn = document.getElementById('play-btn');
            const albumArt = document.getElementById('album-art');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const lyricsList = document.getElementById('lyrics-list');

            // ==========================================
            // 歌词数据
            // ==========================================
            const lyricsData = [
                { time: 0, text: "你我怎么两清" },
                { time: 3, text: "怎么两清" },
                { time: 6, text: "怎么做回甲乙丙丁~" }
            ];

            // 渲染歌词 DOM
            lyricsData.forEach((line, index) => {
                const p = document.createElement('div');
                p.className = 'lyric-line';
                p.textContent = line.text;
                p.dataset.time = line.time;
                p.dataset.index = index;
                lyricsList.appendChild(p);
            });

            const lyricElements = document.querySelectorAll('.lyric-line');
            let activeIndex = -1;

            function formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
                progressBar.max = audio.duration;
            });

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            });

            audio.addEventListener('play', () => {
                playBtn.classList.add('playing');
                albumArt.classList.add('playing');
            });

            audio.addEventListener('pause', () => {
                playBtn.classList.remove('playing');
                albumArt.classList.remove('playing');
            });

            audio.addEventListener('timeupdate', () => {
                const currentTime = audio.currentTime;
                
                if (!isNaN(audio.duration)) {
                    progressBar.value = currentTime;
                    currentTimeEl.textContent = formatTime(currentTime);
                }

                updateLyrics(currentTime);
            });

            progressBar.addEventListener('input', () => {
                audio.currentTime = progressBar.value;
            });

            function updateLyrics(currentTime) {
                let newIndex = -1;
                for (let i = 0; i < lyricsData.length; i++) {
                    if (currentTime >= lyricsData[i].time) {
                        newIndex = i;
                    } else {
                        break;
                    }
                }

                if (newIndex === -1 && currentTime > 0) {
                    newIndex = 0;
                }

                if (newIndex !== activeIndex && newIndex !== -1) {
                    if (activeIndex !== -1 && lyricElements[activeIndex]) {
                        lyricElements[activeIndex].classList.remove('active');
                    }
                    
                    activeIndex = newIndex;
                    const activeEl = lyricElements[activeIndex];
                    activeEl.classList.add('active');

                    activeEl.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }
            }

            audio.addEventListener('ended', () => {
                playBtn.classList.remove('playing');
                albumArt.classList.remove('playing');
                progressBar.value = 0;
                currentTimeEl.textContent = "0:00";
                if (activeIndex !== -1) {
                    lyricElements[activeIndex].classList.remove('active');
                    activeIndex = -1;
                }
            });
        });
    </script>
</body>
</html>
