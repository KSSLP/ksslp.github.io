<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同学，干什么呢</title>
    <link rel="icon" href="ciallo.png" type="image/png">
    <style>
        :root {
            --ink: #1a2b49;
            --ink-soft: #55637c;
            --accent-1: #5b8def;
            --accent-2: #8f7bf0;
            --paper: rgba(255, 255, 255, 0.72);
            --line: rgba(0, 20, 40, 0.08);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0; padding: 2rem 1rem 3rem; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink); text-align: center;
            background: linear-gradient(160deg, #eef4ff 0%, #f7f2ff 45%, #f2fbff 100%);
            overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background:
                radial-gradient(circle at 12% 18%, rgba(91, 141, 239, 0.16), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(143, 123, 240, 0.16), transparent 44%),
                radial-gradient(circle at 50% 92%, rgba(94, 209, 195, 0.14), transparent 46%);
        }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }
        .bg-orb {
            position: fixed; z-index: -1; border-radius: 50%; pointer-events: none;
            filter: blur(40px); opacity: 0.55; animation: orbDrift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 320px; height: 320px; top: -80px; left: -80px; background: radial-gradient(circle, rgba(91, 141, 239, 0.55), transparent 70%); }
        .orb-2 { width: 380px; height: 380px; bottom: -120px; right: -100px; background: radial-gradient(circle, rgba(143, 123, 240, 0.5), transparent 70%); animation-delay: -6s; }
        .orb-3 { width: 260px; height: 260px; top: 45%; right: 4%; background: radial-gradient(circle, rgba(94, 209, 195, 0.45), transparent 70%); opacity: 0.4; animation-delay: -10s; }

        .content-card {
            width: 100%; max-width: 880px; margin: 0 auto; padding: 4rem 3rem;
            background: var(--paper); border-radius: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px -30px rgba(0, 20, 40, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardEnter { 0% { opacity: 0; transform: translateY(40px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .main-title {
            margin: 0 0 3rem; font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800;
            line-height: 1.3; letter-spacing: 0.02em;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: textEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes textEnter { 0% { opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .options-container { display: flex; flex-direction: column; gap: 1.1rem; align-items: center; width: 100%; max-width: 480px; margin: 0 auto; }

        .option-btn {
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            width: 100%; padding: 1.05rem 1.8rem; text-decoration: none;
            font-size: clamp(1.05rem, 3vw, 1.25rem); font-weight: 600; color: #fff;
            border-radius: 999px;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 16px 30px -16px rgba(91, 141, 239, 0.95);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            animation: fadeIn 0.6s ease both;
        }
        .option-btn:nth-child(1) { animation-delay: 0.2s; }
        .option-btn:nth-child(2) { animation-delay: 0.32s; }
        .option-btn::after { content: "→"; font-size: 1.1em; opacity: 0.85; transition: transform 0.22s ease; }
        .option-btn:hover { transform: translateY(-3px); box-shadow: 0 22px 36px -16px rgba(91, 141, 239, 1); }
        .option-btn:hover::after { transform: translateX(4px); }
        .option-btn:active { transform: translateY(1px) scale(0.99); }

        @media (max-width: 480px) {
            .content-card { padding: 3rem 1.5rem; border-radius: 2rem; }
            .main-title { font-size: clamp(1.7rem, 8vw, 2.4rem); margin-bottom: 2.2rem; }
            .option-btn { padding: 0.9rem 1.4rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="content-card">
        <div class="main-title">同学，干什么呢</div>

        <div class="options-container">
            <a href="music.html" class="option-btn" role="button">听一些美妙的歌曲</a>
            <a href="photo.html" class="option-btn" role="button">看一些美妙的照片</a>
        </div>
    </div>
</body>
</html>
