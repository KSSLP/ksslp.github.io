<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私密相册 - 密码验证</title>
    <link rel="icon" href="ciallo.png" type="image/png">
    <style>
        :root {
            --ink: #1a2b49;
            --ink-soft: #55637c;
            --accent-1: #5b8def;
            --accent-2: #8f7bf0;
            --paper: rgba(255, 255, 255, 0.72);
            --line: rgba(0, 20, 40, 0.08);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0; padding: 2rem 1rem 3rem;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #eef4ff 0%, #f7f2ff 45%, #f2fbff 100%);
            overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background:
                radial-gradient(circle at 12% 18%, rgba(91, 141, 239, 0.16), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(143, 123, 240, 0.16), transparent 44%),
                radial-gradient(circle at 50% 92%, rgba(94, 209, 195, 0.14), transparent 46%);
        }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }
        .bg-orb {
            position: fixed; z-index: -1; border-radius: 50%; pointer-events: none;
            filter: blur(40px); opacity: 0.55; animation: orbDrift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 320px; height: 320px; top: -80px; left: -80px; background: radial-gradient(circle, rgba(91, 141, 239, 0.55), transparent 70%); }
        .orb-2 { width: 380px; height: 380px; bottom: -120px; right: -100px; background: radial-gradient(circle, rgba(143, 123, 240, 0.5), transparent 70%); animation-delay: -6s; }

        .album-card {
            width: 100%; max-width: 880px; margin: 0 auto; padding: 4rem 3rem 3rem;
            background: var(--paper); border-radius: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px -30px rgba(0, 20, 40, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardEnter { 0% { opacity: 0; transform: translateY(40px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        #verify-section { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .page-title {
            margin: 0 0 1.5rem; font-size: clamp(1.5rem, 4.2vw, 2.2rem); font-weight: 700;
            line-height: 1.45; letter-spacing: 0.02em;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: textEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes textEnter { 0% { opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .password-form { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
        .password-input {
            width: 100%; padding: 1rem 1.3rem; font-size: 1.15rem; color: var(--ink);
            background: rgba(255, 255, 255, 0.85); border: 1px solid var(--line); border-radius: 999px;
            outline: none; text-align: center;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .password-input:focus { border-color: rgba(91, 141, 239, 0.6); box-shadow: 0 0 0 4px rgba(91, 141, 239, 0.14); }
        .error-msg { min-height: 1.2em; font-size: 0.9rem; color: #d64545; opacity: 0; transition: opacity 0.25s ease; }
        .error-msg.show { opacity: 1; }
        .submit-btn {
            padding: 0.9rem 2.4rem; font-size: 1.05rem; font-weight: 600; color: #fff; cursor: pointer;
            border: none; border-radius: 999px;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 14px 26px -14px rgba(91, 141, 239, 0.9);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 18px 30px -14px rgba(91, 141, 239, 0.95); }
        .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .status-msg { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.7; }
        .retry-btn {
            margin-top: 0.5rem; padding: 0.4rem 1.1rem; font-size: 0.85rem; cursor: pointer;
            color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px;
        }

        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeIn 0.6s ease both; }
        .content-section .page-title { text-align: center; }

        .gallery-container { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; max-width: 800px; margin: 0 auto 1rem; }

        .photo-item {
            background: #fff; border-radius: 1.5rem; padding: 0.8rem;
            box-shadow: 0 15px 30px -10px rgba(0, 20, 40, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.03);
            animation: imgFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; overflow: hidden;
        }
        .photo-name {
            display: flex; align-items: center; gap: 0.45rem;
            margin: 0.1rem 0 0.7rem 0.35rem; font-size: 1.05rem; font-weight: 700; color: var(--ink);
        }
        .photo-name::before { content: "🖼️"; font-size: 1.05em; }
        .photo-item img { width: 100%; height: auto; border-radius: 1rem; display: block; background: #eaf0f6; }
        @keyframes imgFadeIn { 0% { opacity: 0; transform: translateY(20px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .photo-placeholder {
            width: 100%; aspect-ratio: 4 / 3; border-radius: 1rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem;
            background: linear-gradient(135deg, #eef3fb, #f5f1fd);
        }
        .shimmer {
            width: 60%; height: 0.8rem; border-radius: 999px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 255, 255, 0) 100%), #e2e9f5;
            background-size: 200% 100%; animation: shimmer 1.25s linear infinite;
        }
        @keyframes shimmer { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
        .spinner {
            width: 2rem; height: 2rem; border-radius: 50%;
            border: 3px solid rgba(91, 141, 239, 0.2); border-top-color: var(--accent-1);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-status { text-align: center; font-size: 0.9rem; color: var(--ink-soft); padding: 1rem 0 1.5rem; }

        @media (max-width: 480px) {
            .album-card { padding: 3rem 1.5rem; border-radius: 2rem; }
            .page-title { font-size: clamp(1.4rem, 6vw, 2rem); }
            .password-input { padding: 0.9rem 1.2rem; font-size: 1.1rem; }
            .submit-btn { font-size: 1.1rem; padding: 0.9rem 2rem; }
            .gallery-container { gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="album-card">
        <div id="verify-section">
            <div class="page-title">请输入私密相册密码</div>
            <form class="password-form" id="password-form" onsubmit="return false;">
                <input type="password" class="password-input" id="password-input" placeholder="请输入密码" autocomplete="off">
                <div class="error-msg" id="error-msg">密码不正确哦，再想想~</div>
                <button type="submit" class="submit-btn" id="submit-btn" disabled>验证并查看</button>
                <div class="status-msg" id="status-msg">正在加载密码配置...</div>
            </form>
        </div>

        <div class="content-section" id="content-section">
            <div class="page-title">🎉 私密相册已解锁 🎉</div>
            <div class="gallery-container" id="gallery-container"></div>
            <div class="loading-status" id="loading-status">正在加载照片列表...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 纯原生 SHA256（与原逻辑一致，不依赖任何外部 CDN）
        // ==========================================
        function sha256(ascii) {
            function rightRotate(value, amount) {
                return (value>>>amount) | (value<<(32-amount));
            };
            var mathPow = Math.pow;
            var maxWord = mathPow(2, 32);
            var lengthProperty = 'length';
            var i, j;
            var result = '';
            var words = [];
            var asciiBitLength = ascii[lengthProperty] * 8;
            var hash = sha256.h = sha256.h || [];
            var k = sha256.k = sha256.k || [];
            var primeCounter = k[lengthProperty];
            var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
                if (!isComposite[candidate]) {
                    for (i = 0; i < 313; i += candidate) {
                        isComposite[i] = candidate;
                    }
                    hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                    k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
                }
            }
            ascii += '\x80';
            while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii[lengthProperty]; i++) {
                j = ascii.charCodeAt(i);
                if (j >> 8) return;
                words[i >> 2] |= j << ((3 - i) % 4) * 8;
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength);
            for (j = 0; j < words[lengthProperty];) {
                var w = words.slice(j, j += 16);
                var oldHash = hash;
                hash = hash.slice(0, 8);
                for (i = 0; i < 64; i++) {
                    var w15 = w[i - 15], w2 = w[i - 2];
                    var a = hash[0], e = hash[4];
                    var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (
                        w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10))
                    ) | 0);
                    var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                    hash = [(temp1 + temp2) | 0].concat(hash);
                    hash[4] = (hash[4] + temp1) | 0;
                }
                for (i = 0; i < 8; i++) {
                    hash[i] = (hash[i] + oldHash[i]) | 0;
                }
            }
            for (i = 0; i < 8; i++) {
                for (j = 3; j + 1; j--) {
                    var b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? 0 : '') + b.toString(16);
                }
            }
            return result;
        }
        // ==========================================

        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('password-form');
            const input = document.getElementById('password-input');
            const errorMsg = document.getElementById('error-msg');
            const verifySection = document.getElementById('verify-section');
            const contentSection = document.getElementById('content-section');
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');
            const galleryContainer = document.getElementById('gallery-container');
            const loadingStatus = document.getElementById('loading-status');

            let validHash = null;

            async function loadPasswordHash() {
                try {
                    const response = await fetch('private password?t=' + Date.now(), { cache: 'no-store' });
                    if (!response.ok) throw new Error('无法读取密码文件');

                    const text = await response.text();
                    validHash = text.replace(/^\uFEFF/, '').trim();
                    if (!validHash) throw new Error('密码文件为空');

                    statusMsg.style.display = 'none';
                    submitBtn.disabled = false;
                } catch (err) {
                    console.error("读取密码失败:", err);
                    statusMsg.innerHTML = '无法加载密码配置，请检查 private password 文件是否存在。<br><button class="retry-btn" onclick="location.reload()">点此重试</button>';
                    statusMsg.style.color = "#d64545";
                    submitBtn.disabled = true;
                }
            }

            loadPasswordHash();

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (validHash) validatePassword();
            });

            function validatePassword() {
                const answer = input.value.trim();
                if (!answer) return showError("请输入密码哦~");

                const inputHash = sha256(answer);

                if (inputHash.toLowerCase() === validHash.toLowerCase()) {
                    verifySection.style.display = 'none';
                    contentSection.classList.add('active');
                    document.title = "私密相册";
                    input.value = '';
                    errorMsg.classList.remove('show');

                    loadPhotoList();
                } else {
                    showError("密码不正确哦，再想想~");
                    input.value = '';
                    input.focus();
                }
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
                setTimeout(() => { errorMsg.classList.remove('show'); }, 2000);
            }

            // ==========================================
            // 读取 JSON 并渲染照片（一张到位就显示一张）
            // ==========================================
            async function loadPhotoList() {
                try {
                    const response = await fetch('private photo.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!response.ok) throw new Error('无法读取 private photo.json');

                    const photoNames = await response.json();

                    if (!photoNames || photoNames.length === 0) {
                        loadingStatus.textContent = '目前私密相册里没有照片哦。';
                        return;
                    }

                    loadingStatus.style.display = 'none';
                    galleryContainer.innerHTML = '';
                    const extensions = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG', 'webp', 'WEBP'];

                    for (let i = 0; i < photoNames.length; i++) {
                        const name = photoNames[i];

                        const wrapper = document.createElement('div');
                        wrapper.className = 'photo-item';
                        wrapper.style.animationDelay = `${Math.min(i * 0.1, 1)}s`;

                        const nameEl = document.createElement('div');
                        nameEl.className = 'photo-name';
                        nameEl.textContent = name;
                        wrapper.appendChild(nameEl);

                        const placeholder = document.createElement('div');
                        placeholder.className = 'photo-placeholder';
                        placeholder.innerHTML = '<div class="shimmer"></div><div class="shimmer" style="width:40%"></div><div class="spinner"></div>';
                        wrapper.appendChild(placeholder);
                        galleryContainer.appendChild(wrapper);

                        // 自动探测后缀
                        let foundUrl = null;
                        for (const ext of extensions) {
                            const imgSrc = `./private_photo/${name}.${ext}`;
                            if (await probeImage(imgSrc)) { foundUrl = imgSrc; break; }
                        }

                        if (foundUrl) {
                            const imgEl = document.createElement('img');
                            imgEl.alt = name;
                            imgEl.loading = 'lazy';
                            imgEl.src = foundUrl;
                            wrapper.replaceChild(imgEl, placeholder);
                        } else {
                            wrapper.style.display = 'none';
                        }
                    }
                } catch (err) {
                    console.error("加载照片列表失败:", err);
                    loadingStatus.style.display = 'none';
                    galleryContainer.innerHTML = '<div class="loading-status" style="color: #d64545;">无法加载照片，请确保根目录下有正确的 <b>private photo.json</b> 文件。</div>';
                }
            }

            function probeImage(url) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = url;
                });
            }
        });
    </script>
</body>
</html>
