<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私密相册 - 密码验证</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            padding: 1.5rem;
            text-align: center;
            overflow-x: hidden;
        }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.2; z-index: 0; pointer-events: none; animation: orbDrift 18s infinite alternate ease-in-out; }
        .orb-1 { width: 340px; height: 340px; background: #7aa9da; top: -100px; left: -120px; animation-duration: 22s; }
        .orb-2 { width: 420px; height: 420px; background: #b2cfe8; bottom: -150px; right: -130px; animation-duration: 26s; animation-delay: -5s; }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }
        
        .album-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 3rem;
            padding: 4.5rem 3rem;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 25px 40px -12px rgba(0, 20, 40, 0.15), 0 6px 18px rgba(0, 0, 0, 0.05), inset 0 1px 4px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 2;
            animation: cardEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardEnter { 0% { opacity: 0; transform: translateY(40px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        
        .page-title {
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.4;
            color: #162b3c;
            text-shadow: 0 4px 10px rgba(0, 20, 30, 0.06);
            margin-bottom: 2rem;
            word-break: break-word;
            animation: textEnter 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }
        @keyframes textEnter { 0% { opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        
        .password-form { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; max-width: 400px; margin: 0 auto; animation: fadeIn 1s ease 0.5s both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .password-input {
            width: 100%; padding: 1rem 1.5rem; font-size: 1.2rem; border-radius: 100px; border: 2px solid rgba(24, 62, 92, 0.2);
            background: rgba(255, 255, 255, 0.9); outline: none; transition: all 0.3s ease; color: #162b3c; font-weight: 600; text-align: center;
        }
        .password-input:focus { border-color: #183e5c; box-shadow: 0 0 0 4px rgba(24, 62, 92, 0.15); }
        
        .submit-btn {
            display: inline-block; background: #183e5c; color: white; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.06em; padding: 1rem 3rem;
            border-radius: 100px; border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; background-image: linear-gradient(145deg, #1e4a6e, #0d2740);
            box-shadow: 0 18px 30px -10px rgba(20, 45, 70, 0.5), 0 8px 12px -4px rgba(0, 0, 0, 0.15); transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .submit-btn:hover:not(:disabled) { background-image: linear-gradient(145deg, #1d4468, #0a1f30); transform: translateY(-3px) scale(1.02); }
        .submit-btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
        .submit-btn:disabled { background: #a0aec0; cursor: not-allowed; opacity: 0.7; box-shadow: none; }
        
        .error-msg { color: #d32f2f; font-size: 0.95rem; font-weight: 600; min-height: 1.2rem; opacity: 0; transition: opacity 0.3s ease; }
        .error-msg.show { opacity: 1; }
        
        .content-section { display: none; animation: fadeIn 0.8s ease both; width: 100%; }
        .content-section.active { display: block; }
        
        .gallery-container { display: flex; flex-direction: column; gap: 2rem; width: 100%; max-width: 800px; margin: 0 auto 2rem; }
        
        .photo-item {
            background: #fff; border-radius: 1.5rem; padding: 1.2rem;
            box-shadow: 0 15px 30px -10px rgba(0, 20, 40, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.03);
            animation: imgFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; overflow: hidden;
            text-align: left;
        }
        
        /* 图片上方的文件名 */
        .photo-name { 
            font-size: 1.25rem; font-weight: 700; color: #162b3c; margin-bottom: 0.8rem; padding-left: 0.5rem;
            display: flex; align-items: center; gap: 8px;
        }
        .photo-name::before {
            content: "🖼️"; font-size: 1.1em;
        }
        .photo-item img { width: 100%; height: auto; border-radius: 0.8rem; display: block; object-fit: cover; background: #eaf0f6; }
        
        @keyframes imgFadeIn { 0% { opacity: 0; transform: translateY(20px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        
        .loading-status { font-size: 1rem; color: #607d8b; font-weight: 600; margin: 1rem 0; padding: 1rem; background: rgba(255,255,255,0.5); border-radius: 1rem; }
        
        @media (max-width: 480px) {
            .album-card { padding: 3rem 1.5rem; border-radius: 2rem; }
            .page-title { font-size: clamp(1.4rem, 6vw, 2rem); }
            .password-input { padding: 0.9rem 1.2rem; font-size: 1.1rem; }
            .submit-btn { font-size: 1.1rem; padding: 0.9rem 2rem; }
            .gallery-container { gap: 1.5rem; }
            .photo-name { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="album-card">
        <!-- 密码验证区域 -->
        <div id="verify-section">
            <div class="page-title">请输入私密相册密码</div>
            <form class="password-form" id="password-form" onsubmit="return false;">
                <input type="password" class="password-input" id="password-input" placeholder="请输入密码" autocomplete="off">
                <div class="error-msg" id="error-msg">密码不正确哦，再想想~</div>
                <button type="submit" class="submit-btn" id="submit-btn" disabled>验证并查看</button>
                <div class="status-msg" id="status-msg" style="font-size: 0.9rem; color: #607d8b;">正在加载密码配置...</div>
            </form>
        </div>

        <!-- 正文区域（默认隐藏） -->
        <div class="content-section" id="content-section">
            <div class="page-title" style="margin-bottom: 3rem;">🎉 私密相册已解锁 🎉</div>
            <div class="gallery-container" id="gallery-container">
                <div class="loading-status">正在加载照片列表...</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('password-form');
            const input = document.getElementById('password-input');
            const errorMsg = document.getElementById('error-msg');
            const verifySection = document.getElementById('verify-section');
            const contentSection = document.getElementById('content-section');
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');
            const galleryContainer = document.getElementById('gallery-container');

            let validHash = null;

            // 加载密码哈希
            async function loadPasswordHash() {
                try {
                    const response = await fetch('private password?t=' + Date.now(), { cache: 'no-store' });
                    if (!response.ok) throw new Error('无法读取密码文件');
                    
                    const text = await response.text();
                    validHash = text.replace(/^\uFEFF/, '').trim();
                    if (!validHash) throw new Error('密码文件为空');
                    
                    statusMsg.style.display = 'none';
                    submitBtn.disabled = false;
                } catch (err) {
                    console.error("读取密码失败:", err);
                    statusMsg.textContent = "无法加载密码配置，请检查 private password 文件是否存在。";
                    statusMsg.style.color = "#d32f2f";
                    submitBtn.disabled = true;
                }
            }

            loadPasswordHash();

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (validHash) validatePassword();
            });

            function validatePassword() {
                const answer = input.value.trim();
                if (!answer) return showError("请输入密码哦~");

                const inputHash = CryptoJS.SHA256(answer).toString(CryptoJS.enc.Hex);

                if (inputHash.toLowerCase() === validHash.toLowerCase()) {
                    verifySection.style.display = 'none';
                    contentSection.classList.add('active');
                    document.title = "私密相册";
                    input.value = '';
                    errorMsg.classList.remove('show');
                    
                    // 验证成功，加载 JSON 相册
                    loadPhotoList();
                } else {
                    showError("密码不正确哦，再想想~");
                    input.value = '';
                    input.focus();
                }
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
                setTimeout(() => { errorMsg.classList.remove('show'); }, 2000);
            }

            // ==========================================
            // 读取 JSON 并渲染照片
            // ==========================================
            async function loadPhotoList() {
                try {
                    // 已修改：请求根目录下的 private photo.json 文件
                    const response = await fetch('private photo.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!response.ok) throw new Error('无法读取 private photo.json');
                    
                    // 解析 JSON，格式为：["照片名字1", "照片名字2"]
                    const photoNames = await response.json();

                    if (!photoNames || photoNames.length === 0) {
                        galleryContainer.innerHTML = `<div class="loading-status">目前私密相册里没有照片哦。</div>`;
                        return;
                    }

                    galleryContainer.innerHTML = ''; // 清空加载提示
                    const extensions = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG', 'webp', 'WEBP'];

                    // 遍历 JSON 里的名字，去 private_photo 文件夹里找图
                    for (let i = 0; i < photoNames.length; i++) {
                        const name = photoNames[i];
                        
                        const wrapper = document.createElement('div');
                        wrapper.className = 'photo-item';
                        wrapper.style.animationDelay = `${i * 0.1}s`;

                        const nameEl = document.createElement('div');
                        nameEl.className = 'photo-name';
                        nameEl.textContent = name; // 显示 JSON 里的名字
                        wrapper.appendChild(nameEl);

                        const imgEl = document.createElement('img');
                        imgEl.alt = name;
                        imgEl.loading = 'lazy';
                        wrapper.appendChild(imgEl);
                        
                        galleryContainer.appendChild(wrapper);

                        // 自动探测后缀
                        let found = false;
                        for (let ext of extensions) {
                            const imgSrc = `./private_photo/${name}.${ext}`; 
                            if (await probeImage(imgSrc)) {
                                imgEl.src = imgSrc;
                                found = true;
                                break;
                            }
                        }
                        
                        // 如果没找到对应的图，隐藏该占位
                        if (!found) {
                            wrapper.style.display = 'none';
                        }
                    }
                } catch (err) {
                    console.error("加载照片列表失败:", err);
                    galleryContainer.innerHTML = `<div class="loading-status" style="color: #d32f2f;">无法加载照片，请确保根目录下有正确的 <b>private photo.json</b> 文件。</div>`;
                }
            }

            // 探测图片是否存在的辅助函数
            function probeImage(url) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = url;
                });
            }
        });
    </script>
</body>
</html>
