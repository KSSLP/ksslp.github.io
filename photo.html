<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私密相册</title>
    <style>
        :root {
            --ink: #1a2b49;
            --ink-soft: #55637c;
            --accent-1: #5b8def;
            --accent-2: #8f7bf0;
            --paper: rgba(255, 255, 255, 0.72);
            --line: rgba(0, 20, 40, 0.08);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0; padding: 2rem 1rem 3rem;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #eef4ff 0%, #f7f2ff 45%, #f2fbff 100%);
            overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background:
                radial-gradient(circle at 12% 18%, rgba(91, 141, 239, 0.16), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(143, 123, 240, 0.16), transparent 44%),
                radial-gradient(circle at 50% 92%, rgba(94, 209, 195, 0.14), transparent 46%);
        }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }
        .bg-orb {
            position: fixed; z-index: -1; border-radius: 50%; pointer-events: none;
            filter: blur(40px); opacity: 0.55; animation: orbDrift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 320px; height: 320px; top: -80px; left: -80px; background: radial-gradient(circle, rgba(91, 141, 239, 0.55), transparent 70%); }
        .orb-2 { width: 380px; height: 380px; bottom: -120px; right: -100px; background: radial-gradient(circle, rgba(143, 123, 240, 0.5), transparent 70%); animation-delay: -6s; }

        .top-left-link {
            position: fixed; top: 1rem; left: 1rem; z-index: 10;
            padding: 0.5rem 0.95rem; border-radius: 999px;
            font-size: 0.85rem; letter-spacing: 0.02em; text-decoration: none; color: var(--ink-soft);
            background: rgba(255, 255, 255, 0.7); border: 1px solid var(--line);
            box-shadow: 0 6px 18px -12px rgba(0, 20, 40, 0.5);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            transition: color 0.25s ease, background 0.25s ease;
        }
        .top-left-link:hover { color: var(--ink); background: #fff; }

        .photo-card {
            width: 100%; max-width: 880px; margin: 0 auto; padding: 3.5rem 3rem 3rem;
            background: var(--paper); border-radius: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px -30px rgba(0, 20, 40, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardEnter { 0% { opacity: 0; transform: translateY(40px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .page-title {
            margin: 0 0 1.5rem; font-size: clamp(1.5rem, 4.2vw, 2.2rem); font-weight: 700;
            line-height: 1.45; letter-spacing: 0.02em;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: textEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes textEnter { 0% { opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #verify-section { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .password-form { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
        .password-input {
            width: 100%; padding: 1rem 1.3rem; font-size: 1.15rem; color: var(--ink);
            background: rgba(255, 255, 255, 0.85); border: 1px solid var(--line); border-radius: 999px;
            outline: none; text-align: center;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .password-input:focus { border-color: rgba(91, 141, 239, 0.6); box-shadow: 0 0 0 4px rgba(91, 141, 239, 0.14); }
        .error-msg { min-height: 1.2em; font-size: 0.9rem; color: #d64545; opacity: 0; transition: opacity 0.25s ease; }
        .error-msg.show { opacity: 1; }
        .submit-btn {
            padding: 0.9rem 2.4rem; font-size: 1.05rem; font-weight: 600; color: #fff; cursor: pointer;
            border: none; border-radius: 999px;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 14px 26px -14px rgba(91, 141, 239, 0.9);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 18px 30px -14px rgba(91, 141, 239, 0.95); }
        .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .status-msg { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.7; }
        .retry-btn {
            margin-top: 0.5rem; padding: 0.4rem 1.1rem; font-size: 0.85rem; cursor: pointer;
            color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px;
        }

        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeIn 0.6s ease both; }

        .gallery-container { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; max-width: 800px; margin: 0 auto 2rem; }
        .photo-item {
            background: #fff; border-radius: 1.5rem; padding: 0.8rem;
            box-shadow: 0 15px 30px -10px rgba(0, 20, 40, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.03);
            animation: imgFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; overflow: hidden;
        }
        .photo-item img { width: 100%; height: auto; border-radius: 1rem; display: block; background: #eaf0f6; }
        .photo-item .img-loaded { animation: imgFadeIn 0.5s ease both; }
        @keyframes imgFadeIn { 0% { opacity: 0; transform: translateY(20px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .photo-placeholder {
            width: 100%; aspect-ratio: 4 / 3; border-radius: 1rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem;
            background: linear-gradient(135deg, #eef3fb, #f5f1fd);
        }
        .shimmer {
            width: 60%; height: 0.8rem; border-radius: 999px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 255, 255, 0) 100%), #e2e9f5;
            background-size: 200% 100%; animation: shimmer 1.25s linear infinite;
        }
        @keyframes shimmer { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
        .spinner {
            width: 2rem; height: 2rem; border-radius: 50%;
            border: 3px solid rgba(91, 141, 239, 0.2); border-top-color: var(--accent-1);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .item-failed { padding: 2.5rem 1rem; text-align: center; font-size: 0.9rem; color: var(--ink-soft); }

        .pagination-controls {
            display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap;
            margin-top: 1rem; padding-top: 1.5rem; border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        .page-btn {
            padding: 0.6rem 1.4rem; font-size: 0.95rem; cursor: pointer; color: var(--ink);
            background: #fff; border: 1px solid var(--line); border-radius: 999px;
            transition: background 0.2s ease, opacity 0.2s ease;
        }
        .page-btn:hover:not(:disabled) { background: #f3f7ff; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-jump { font-size: 0.95rem; color: var(--ink-soft); }
        .page-jump input {
            width: 4.5rem; padding: 0.4rem 0.6rem; margin: 0 0.25rem; text-align: center;
            font-size: 0.95rem; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 0.7rem; outline: none;
        }
        .loading-more { text-align: center; font-size: 0.85rem; color: var(--ink-soft); padding: 0.5rem 0 1rem; }

        @media (max-width: 480px) {
            .photo-card { padding: 3rem 1.5rem; border-radius: 2rem; }
            .page-title { font-size: clamp(1.4rem, 6vw, 2rem); }
            .password-input { padding: 0.9rem 1.2rem; font-size: 1.1rem; }
            .submit-btn { font-size: 1.1rem; padding: 0.9rem 2rem; }
            .gallery-container { gap: 1rem; }
        }
    </style>
</head>
<body>
    <a href="private album.html" class="top-left-link">私密相册</a>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="photo-card">
        <div id="verify-section">
            <div class="page-title" id="question-title">正在加载题目...</div>
            <form class="password-form" id="password-form" onsubmit="return false;">
                <input type="text" class="password-input" id="password-input" placeholder="请输入您的回答" autocomplete="off">
                <div class="error-msg" id="error-msg">回答不正确哦，再想想~</div>
                <button type="submit" class="submit-btn" id="submit-btn" disabled>验证并查看</button>
                <div class="status-msg" id="status-msg">正在加载密码配置...</div>
            </form>
        </div>

        <div class="content-section" id="content-section">
            <div class="page-title">🎉 验证成功 🎉</div>
            <div class="gallery-container" id="gallery-container"></div>
            <div class="loading-more" id="loading-more" style="display: none;">相册还在加载中…</div>
            <div class="pagination-controls" id="pagination-controls">
                <button class="page-btn" id="prev-btn">上一页</button>
                <div class="page-jump">
                    第 <input type="number" id="page-input" min="1" value="1"> 页 / 共 <span id="total-pages">?</span> 页
                </div>
                <button class="page-btn" id="next-btn">下一页</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 纯原生 SHA256 算法实现（不依赖任何网络 CDN）
        // ==========================================
        function sha256(ascii) {
            function rightRotate(value, amount) {
                return (value>>>amount) | (value<<(32-amount));
            };
            var mathPow = Math.pow;
            var maxWord = mathPow(2, 32);
            var lengthProperty = 'length';
            var i, j;
            var result = '';
            var words = [];
            var asciiBitLength = ascii[lengthProperty] * 8;
            var hash = sha256.h = sha256.h || [];
            var k = sha256.k = sha256.k || [];
            var primeCounter = k[lengthProperty];
            var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
                if (!isComposite[candidate]) {
                    for (i = 0; i < 313; i += candidate) {
                        isComposite[i] = candidate;
                    }
                    hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                    k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
                }
            }
            ascii += '\x80';
            while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii[lengthProperty]; i++) {
                j = ascii.charCodeAt(i);
                if (j >> 8) return;
                words[i >> 2] |= j << ((3 - i) % 4) * 8;
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength);
            for (j = 0; j < words[lengthProperty];) {
                var w = words.slice(j, j += 16);
                var oldHash = hash;
                hash = hash.slice(0, 8);
                for (i = 0; i < 64; i++) {
                    var w15 = w[i - 15], w2 = w[i - 2];
                    var a = hash[0], e = hash[4];
                    var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (
                        w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10))
                    ) | 0);
                    var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                    hash = [(temp1 + temp2) | 0].concat(hash);
                    hash[4] = (hash[4] + temp1) | 0;
                }
                for (i = 0; i < 8; i++) {
                    hash[i] = (hash[i] + oldHash[i]) | 0;
                }
            }
            for (i = 0; i < 8; i++) {
                for (j = 3; j + 1; j--) {
                    var b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? 0 : '') + b.toString(16);
                }
            }
            return result;
        }
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            const form = document.getElementById('password-form');
            const input = document.getElementById('password-input');
            const errorMsg = document.getElementById('error-msg');
            const verifySection = document.getElementById('verify-section');
            const contentSection = document.getElementById('content-section');
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');
            const questionTitle = document.getElementById('question-title');
            
            const galleryContainer = document.getElementById('gallery-container');
            const paginationControls = document.getElementById('pagination-controls');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const pageInput = document.getElementById('page-input');
            const totalPagesSpan = document.getElementById('total-pages');
            const loadingMore = document.getElementById('loading-more');

            let hash1 = null, hash2 = null, currentHashToCheck = null, currentQuestionIndex = 0;
            const questions = [
                "谁是世界上最温柔最善良的老师呀<br>（名字缩写）",
                "蛋糕大王是谁呀<br>（名字缩写）"
            ];

            const EXTENSIONS = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG', 'webp', 'WEBP'];
            const IMAGES_PER_PAGE = 5;
            const MAX_SCAN = 100;          // 最多探测到第几张
            const MAX_MISSES = 3;          // 连续这么多次探测不到就认为到底了

            // 默认是手动翻页；想恢复“整页加载完自动翻下一页”，把这里改成 2000 之类的毫秒数即可
            const AUTO_ADVANCE_DELAY = 0;

            // 相册状态
            let indexedNumber = 0;    // 已确认存在的最大照片编号
            let scanDone = false;     // 是否已经结束扫描

            const pageCache = new Map(); // 页码 -> 该页的探测/加载状态

            let currentPage = 1;
            let scanCursor = 1;           // 总扫描器下一步要探测的编号
            let scanRunning = false;
            let lastAdvanceAt = 0;
            let advanceTimer = null;

            async function initPassword() {
                // 如果 3 秒后还没加载出来，强制报错，不卡界面
                const timeoutUI = setTimeout(() => {
                    if (submitBtn.disabled) {
                        questionTitle.textContent = "加载超时";
                        statusMsg.innerHTML = `网络请求超时<br><span style="font-size:0.8rem; opacity:0.8;">请检查 password 文件是否上传，路径是否正确</span><br><button class="retry-btn" onclick="location.reload()">点此重试</button>`;
                        statusMsg.style.color = "#d32f2f";
                    }
                }, 3000);

                try {
                    // 纯本地路径，防止被当作追踪器拦截
                    const response = await fetch('./password', { cache: 'no-store' });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const text = await response.text();
                    const lines = text.split(/\r?\n/).map(line => line.replace(/^\uFEFF/, '').trim()).filter(line => line.length > 0);
                    
                    if (lines.length < 2) throw new Error('密码文件配置不完整');
                    
                    hash1 = lines[0];
                    hash2 = lines[1];

                    currentQuestionIndex = Math.random() < 0.5 ? 0 : 1;
                    questionTitle.innerHTML = questions[currentQuestionIndex];
                    currentHashToCheck = currentQuestionIndex === 0 ? hash1 : hash2;

                    clearTimeout(timeoutUI);
                    statusMsg.style.display = 'none';
                    submitBtn.disabled = false;
                } catch (err) {
                    clearTimeout(timeoutUI);
                    console.error("读取密码失败:", err);
                    questionTitle.textContent = "加载失败";
                    statusMsg.innerHTML = `无法加载密码配置 (${err.message})<br><span style="font-size:0.8rem; opacity:0.8;">请检查根目录下是否有 password 文件</span><br><button class="retry-btn" onclick="location.reload()">点此重试</button>`;
                    statusMsg.style.color = "#d32f2f";
                }
            }

            initPassword();

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (currentHashToCheck) validatePassword();
            });

            function validatePassword() {
                let answer = input.value.trim();
                if (!answer) return showError("请输入答案哦~");

                if (currentQuestionIndex === 1) answer = answer.toLowerCase();
                
                // 调用本地的 sha256 函数
                const inputHash = sha256(answer);

                if (inputHash.toLowerCase() === currentHashToCheck.toLowerCase()) {
                    verifySection.style.display = 'none';
                    contentSection.classList.add('active');
                    input.value = '';
                    errorMsg.classList.remove('show');
                    
                    document.title = "美妙照片";
                    
                    currentPage = 1;
                    renderPage();
                    startScanner();
                    startFiller();
                } else {
                    showError("回答不正确哦，再想想~");
                    input.value = '';
                    input.focus();
                }
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
                setTimeout(() => { errorMsg.classList.remove('show'); }, 2000);
            }

            // ---------- 各页状态 ----------

            function getSlot(page) {
                let slot = pageCache.get(page);
                if (!slot) {
                    slot = {
                        pending: new Set(),   // 正在探测/加载中的编号
                        started: new Map(),   // 已显示占位图的元素
                        loaded: new Map(),    // 已加载完成的：编号 -> 地址
                        failed: new Set()     // 确认不存在的编号
                    };
                    pageCache.set(page, slot);
                }
                return slot;
            }

            // 已确认的最大页数（扫到底之前，至少保证第 1 页）
            function knownPages() {
                return Math.max(1, Math.ceil(indexedNumber / IMAGES_PER_PAGE));
            }

            // 扫描结束后的真实总页数
            function finalPages() {
                return Math.max(1, Math.ceil(indexedNumber / IMAGES_PER_PAGE));
            }

            // 点“下一页”实际能去到的最大页数
            // 扫描中：多给一页（那一页正在被后台探测）；扫描结束：只有真实页数
            function navMax() {
                return scanDone ? finalPages() : knownPages() + 1;
            }

            function canGoNext() {
                return currentPage < navMax();
            }

            // ---------- 渲染 ----------

            function renderPage() {
                clearAdvanceTimer();
                const page = currentPage;
                const slot = getSlot(page);
                const start = (page - 1) * IMAGES_PER_PAGE + 1;

                galleryContainer.innerHTML = '';

                let shown = 0;
                for (let i = start; i < start + IMAGES_PER_PAGE; i++) {
                    if (slot.loaded.has(i)) {
                        galleryContainer.appendChild(buildLoadedItem(i, slot.loaded.get(i)));
                        shown++;
                    } else if (slot.failed.has(i)) {
                        continue;
                    } else {
                        galleryContainer.appendChild(addPendingIndex(slot, i));
                        shown++;
                    }
                }

                if (shown === 0) {
                    const box = document.createElement('div');
                    box.className = 'photo-item item-failed';
                    box.textContent = '这一页没有照片';
                    galleryContainer.appendChild(box);
                }

                ensureLoading(page);
                updatePaginationUI();
                updateLoadingMore();
                maybeScheduleAdvance();
            }

            function addPendingIndex(slot, index) {
                let el = slot.started.get(index);
                if (el) return el;
                el = buildPlaceholder(index);
                slot.started.set(index, el);
                return el;
            }

            function buildPlaceholder(index) {
                const wrapper = document.createElement('div');
                wrapper.className = 'photo-item';
                wrapper.style.animationDelay = `${(index % IMAGES_PER_PAGE) * 0.1}s`;
                wrapper.innerHTML = '<div class="photo-placeholder"><div class="shimmer"></div><div class="shimmer" style="width:40%"></div><div class="spinner"></div></div>';
                return wrapper;
            }

            function buildLoadedItem(index, url) {
                const wrapper = document.createElement('div');
                wrapper.className = 'photo-item';
                wrapper.style.animationDelay = `${(index % IMAGES_PER_PAGE) * 0.1}s`;

                const imgEl = document.createElement('img');
                imgEl.alt = `照片 ${index}`;
                imgEl.className = 'img-loaded';
                imgEl.decoding = 'async';
                imgEl.src = url;
                wrapper.appendChild(imgEl);
                return wrapper;
            }

            // 把某一张改成已加载 / 不存在。如果正显示在屏幕上，立刻替换占位图
            function settleIndex(index, url) {
                const page = Math.ceil(index / IMAGES_PER_PAGE);
                const slot = getSlot(page);
                slot.pending.delete(index);
                if (url) {
                    if (slot.loaded.has(index)) return;
                    slot.loaded.set(index, url);
                } else if (slot.loaded.has(index)) {
                    return;
                } else {
                    slot.failed.add(index);
                }
                spliceIndexIntoPage(index, url);
                updatePaginationUI();
                updateLoadingMore();
                maybeScheduleAdvance();
            }

            // 就地更新当前页的 DOM：按编号顺序找到正确位置，避免跳动
            function spliceIndexIntoPage(index, url) {
                if (Math.ceil(index / IMAGES_PER_PAGE) !== currentPage) return;
                const page = Math.ceil(index / IMAGES_PER_PAGE);
                const slot = getSlot(page);
                const start = (page - 1) * IMAGES_PER_PAGE + 1;
                const ph = slot.started.get(index);
                const item = url ? buildLoadedItem(index, url) : null;

                if (!ph || !ph.parentNode) {
                    // 这一格之前没显示：插到按编号排好的位置
                    if (item) insertItemInOrder(item, index, start);
                    return;
                }
                if (item) ph.parentNode.replaceChild(item, ph);
                else ph.parentNode.removeChild(ph);
                clearEmptyPlaceholder();
            }

            function insertItemInOrder(item, index, start) {
                let ref = null;
                for (let i = index + 1; i < start + IMAGES_PER_PAGE; i++) {
                    const el = getSlot(currentPage).started.get(i);
                    if (el && el.parentNode === galleryContainer) { ref = el; break; }
                    const loadedEl = galleryContainer.querySelector(`.photo-item[data-index="${i}"]`);
                    if (loadedEl) { ref = loadedEl; break; }
                }
                item.dataset.index = index;
                galleryContainer.insertBefore(item, ref);
            }

            function clearEmptyPlaceholder() {
                const empty = galleryContainer.querySelector('.item-failed');
                if (empty && galleryContainer.children.length > 1) empty.remove();
            }

            // ---------- 扫描 / 预加载 ----------

            // 某一页的每一格都已经确定（有图或没图）
            function pageFullyLoaded(page) {
                const slot = getSlot(page);
                if (slot.pending.size > 0) return false;
                const start = (page - 1) * IMAGES_PER_PAGE + 1;
                for (let i = start; i < start + IMAGES_PER_PAGE; i++) {
                    if (!slot.loaded.has(i) && !slot.failed.has(i)) return false;
                }
                return true;
            }

            // 只加载某一页（不会越界去染指别的页面的编号）
            function loadPage(page) {
                const slot = getSlot(page);
                const start = (page - 1) * IMAGES_PER_PAGE + 1;
                for (let i = start; i < start + IMAGES_PER_PAGE; i++) {
                    if (i > MAX_SCAN) continue;
                    if (i > indexedNumber + MAX_MISSES && scanDone) continue;
                    if (slot.loaded.has(i) || slot.failed.has(i) || slot.pending.has(i)) continue;
                    slot.pending.add(i);
                    probeExisting(i).then(url => settleIndex(i, url));
                }
            }

            // 当前页优先；当前页到齐后顺带预热下一页
            function ensureLoading(page) {
                loadPage(page);
                if (pageFullyLoaded(page) && page < navMax()) {
                    loadPage(page + 1);
                }
            }

            async function probeExisting(index) {
                for (const ext of EXTENSIONS) {
                    const url = `./photo/${index}.${ext}`;
                    if (await probeImage(url)) return url;
                }
                return null;
            }

            function probeImage(url) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = url;
                });
            }

            // 总扫描器：只做一件事——顺序探测 1,2,3... 直到连续 MAX_MISSES 张都不存在，
            // 用来确定照片总数和真实总页数。（不负责渲染，也不会跳到别的页）
            async function startScanner() {
                if (scanRunning) return;
                scanRunning = true;
                let missStreak = 0;
                let index = 1;

                while (index <= MAX_SCAN) {
                    const slot = getSlot(Math.ceil(index / IMAGES_PER_PAGE));

                    if (slot.loaded.has(index)) {
                        missStreak = 0;
                        indexedNumber = Math.max(indexedNumber, index);
                    } else if (slot.failed.has(index)) {
                        missStreak++;
                    } else {
                        slot.pending.add(index);
                        const url = await probeExisting(index);
                        settleIndex(index, url);
                        if (url) {
                            missStreak = 0;
                            indexedNumber = Math.max(indexedNumber, index);
                        } else {
                            missStreak++;
                        }
                    }

                    // 每张都刷新一次分页，保证“共 N 页”随扫描增长
                    updatePaginationUI();

                    if (missStreak >= MAX_MISSES) break;

                    index++;
                    scanCursor = index;
                    await sleep(20);
                }

                scanDone = true;
                scanRunning = false;

                // 收尾：丢掉越界的“空页”，并把当前页夹回真实范围内
                pruneBeyondEnd();
                if (currentPage > finalPages()) {
                    currentPage = finalPages();
                }
                if (currentPage < 1) currentPage = 1;
                renderPage();
            }

            function pruneBeyondEnd() {
                const maxPage = finalPages();
                pageCache.forEach((slot, page) => {
                    if (page <= maxPage) return;
                    pageCache.delete(page);
                });
            }

            // 当前页补图器：访问到某一页时，确保这一页正在被探测
            function startFiller() {
                setInterval(() => {
                    if (document.hidden) return;
                    const slot = getSlot(currentPage);
                    if (slot.pending.size > 0) return;
                    if (!pageFullyLoaded(currentPage)) loadPage(currentPage);
                }, 1200);
            }

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            // ---------- 自动翻页（默认关闭） ----------

            function clearAdvanceTimer() {
                if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
            }

            function maybeScheduleAdvance() {
                if (!AUTO_ADVANCE_DELAY) return;
                if (advanceTimer) return;
                if (!pageFullyLoaded(currentPage)) return;
                if (!canGoNext()) return;

                const wait = Math.max(0, AUTO_ADVANCE_DELAY - (Date.now() - lastAdvanceAt));
                const page = currentPage;
                advanceTimer = setTimeout(() => {
                    advanceTimer = null;
                    if (page !== currentPage) return;
                    if (!pageFullyLoaded(currentPage) || !canGoNext()) return;
                    lastAdvanceAt = Date.now();
                    currentPage = page + 1;
                    renderPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, wait);
            }

            // ---------- 翻页控件 ----------

            function updateLoadingMore() {
                const slot = getSlot(currentPage);
                loadingMore.style.display = (slot.pending.size > 0) ? 'block' : 'none';
                loadingMore.textContent = '相册还在加载中…';
            }

            function updatePaginationUI() {
                prevBtn.disabled = currentPage <= 1;
                nextBtn.disabled = !canGoNext();

                if (indexedNumber === 0 && scanDone) {
                    totalPagesSpan.textContent = '1';
                    pageInput.max = '1';
                } else if (scanDone) {
                    totalPagesSpan.textContent = String(finalPages());
                    pageInput.max = String(finalPages());
                } else {
                    // 扫描中：显示已确认页数 + “…”，表示后面可能还有
                    totalPagesSpan.textContent = knownPages() + '…';
                    pageInput.max = String(knownPages() + 1);
                }
                pageInput.value = currentPage;
            }

            function goToPage(page) {
                page = Math.min(Math.max(1, page), navMax());
                if (page === currentPage) { pageInput.value = currentPage; return; }
                currentPage = page;
                renderPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) goToPage(currentPage - 1);
            });

            nextBtn.addEventListener('click', () => {
                if (canGoNext()) goToPage(currentPage + 1);
            });

            pageInput.addEventListener('change', (e) => {
                const val = parseInt(e.target.value);
                if (isNaN(val)) { e.target.value = currentPage; return; }
                goToPage(val);
            });

            pageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    pageInput.blur();
                }
            });
        }
    </script>
</body>
</html>
