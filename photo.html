<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片 - 密码验证</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            padding: 1.5rem;
            text-align: center;
            overflow-x: hidden;
        }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.2; z-index: 0; pointer-events: none; animation: orbDrift 18s infinite alternate ease-in-out; }
        .orb-1 { width: 340px; height: 340px; background: #7aa9da; top: -100px; left: -120px; animation-duration: 22s; }
        .orb-2 { width: 420px; height: 420px; background: #b2cfe8; bottom: -150px; right: -130px; animation-duration: 26s; animation-delay: -5s; }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }
        .photo-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 3rem;
            padding: 4.5rem 3rem;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 25px 40px -12px rgba(0, 20, 40, 0.15), 0 6px 18px rgba(0, 0, 0, 0.05), inset 0 1px 4px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 2;
            animation: cardEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardEnter { 0% { opacity: 0; transform: translateY(40px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .page-title {
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.4;
            color: #162b3c;
            text-shadow: 0 4px 10px rgba(0, 20, 30, 0.06);
            margin-bottom: 2rem;
            word-break: break-word;
            animation: textEnter 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }
        @keyframes textEnter { 0% { opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        .password-form { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; max-width: 400px; margin: 0 auto; animation: fadeIn 1s ease 0.5s both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .password-input {
            width: 100%; padding: 1rem 1.5rem; font-size: 1.2rem; border-radius: 100px; border: 2px solid rgba(24, 62, 92, 0.2);
            background: rgba(255, 255, 255, 0.9); outline: none; transition: all 0.3s ease; color: #162b3c; font-weight: 600; text-align: center;
        }
        .password-input:focus { border-color: #183e5c; box-shadow: 0 0 0 4px rgba(24, 62, 92, 0.15); }
        .submit-btn {
            display: inline-block; background: #183e5c; color: white; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.06em; padding: 1rem 3rem;
            border-radius: 100px; border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; background-image: linear-gradient(145deg, #1e4a6e, #0d2740);
            box-shadow: 0 18px 30px -10px rgba(20, 45, 70, 0.5), 0 8px 12px -4px rgba(0, 0, 0, 0.15); transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .submit-btn:hover:not(:disabled) { background-image: linear-gradient(145deg, #1d4468, #0a1f30); transform: translateY(-3px) scale(1.02); }
        .submit-btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
        .submit-btn:disabled { background: #a0aec0; cursor: not-allowed; opacity: 0.7; box-shadow: none; }
        .error-msg { color: #d32f2f; font-size: 0.95rem; font-weight: 600; min-height: 1.2rem; opacity: 0; transition: opacity 0.3s ease; }
        .error-msg.show { opacity: 1; }
        .content-section { display: none; animation: fadeIn 0.8s ease both; width: 100%; }
        .content-section.active { display: block; }
        
        .gallery-container { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; max-width: 800px; margin: 0 auto 2rem; }
        .photo-item {
            background: #fff; border-radius: 1.5rem; padding: 0.8rem;
            box-shadow: 0 15px 30px -10px rgba(0, 20, 40, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.03);
            animation: imgFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; overflow: hidden;
        }
        .photo-item img { width: 100%; height: auto; border-radius: 1rem; display: block; object-fit: cover; background: #eaf0f6; }
        @keyframes imgFadeIn { 0% { opacity: 0; transform: translateY(20px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        
        .pagination-controls {
            display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap;
            margin-top: 1rem; padding-top: 1.5rem; border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        .page-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: #e0e8f0; color: #183e5c; font-size: 1rem; font-weight: 700;
            padding: 0.6rem 1.5rem; border-radius: 100px; border: none; cursor: pointer; transition: all 0.3s ease; text-decoration: none;
        }
        .page-btn:hover:not(:disabled) { background: #183e5c; color: white; transform: translateY(-2px); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-jump {
            display: flex; align-items: center; gap: 0.5rem; font-size: 1rem; font-weight: 600; color: #607d8b;
            background: rgba(255, 255, 255, 0.6); padding: 0.4rem 0.8rem; border-radius: 50px; border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .page-jump input {
            width: 50px; padding: 0.4rem; border: 2px solid rgba(24, 62, 92, 0.15); border-radius: 8px; text-align: center;
            font-size: 1rem; font-weight: 700; color: #183e5c; outline: none; transition: border-color 0.2s;
        }
        .page-jump input:focus { border-color: #183e5c; }
        
        .loading-status { font-size: 1rem; color: #607d8b; font-weight: 600; margin: 1rem 0; padding: 1rem; background: rgba(255,255,255,0.5); border-radius: 1rem; }
        
        @media (max-width: 480px) {
            .photo-card { padding: 3rem 1.5rem; border-radius: 2rem; }
            .page-title { font-size: clamp(1.4rem, 6vw, 2rem); }
            .password-input { padding: 0.9rem 1.2rem; font-size: 1.1rem; }
            .submit-btn { font-size: 1.1rem; padding: 0.9rem 2rem; }
            .gallery-container { gap: 1rem; }
            .pagination-controls { gap: 0.5rem; }
            .page-btn { padding: 0.5rem 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="photo-card">
        <div id="verify-section">
            <div class="page-title" id="question-title">正在加载题目...</div>
            <form class="password-form" id="password-form" onsubmit="return false;">
                <input type="text" class="password-input" id="password-input" placeholder="请输入您的回答" autocomplete="off">
                <div class="error-msg" id="error-msg">回答不正确哦，再想想~</div>
                <button type="submit" class="submit-btn" id="submit-btn" disabled>验证并查看</button>
                <div class="status-msg" id="status-msg">正在加载密码配置...</div>
            </form>
        </div>

        <div class="content-section" id="content-section">
            <div class="page-title">🎉 验证成功 🎉</div>
            
            <div class="gallery-container" id="gallery-container">
                <div class="loading-status" id="loading-status">正在扫描照片，请稍候...</div>
            </div>

            <div class="pagination-controls" id="pagination-controls" style="display: none;">
                <button class="page-btn" id="prev-btn">上一页</button>
                <div class="page-jump">
                    第 <input type="number" id="page-input" min="1" value="1"> 页 / 共 <span id="total-pages">1</span> 页
                </div>
                <button class="page-btn" id="next-btn">下一页</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('password-form');
            const input = document.getElementById('password-input');
            const errorMsg = document.getElementById('error-msg');
            const verifySection = document.getElementById('verify-section');
            const contentSection = document.getElementById('content-section');
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');
            const questionTitle = document.getElementById('question-title');
            
            const galleryContainer = document.getElementById('gallery-container');
            const paginationControls = document.getElementById('pagination-controls');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const pageInput = document.getElementById('page-input');
            const totalPagesSpan = document.getElementById('total-pages');

            let hash1 = null, hash2 = null, currentHashToCheck = null, currentQuestionIndex = 0;
            const questions = [
                "谁是世界上最温柔最善良的老师呀<br>（用上海话回答）",
                "蛋糕大王是谁呀<br>（名字缩写）"
            ];

            const IMAGES_PER_PAGE = 5;
            let allImages = [];
            let currentPage = 1;
            let totalPages = 1;

            // ==========================================
            // 1. 密码逻辑
            // ==========================================
            async function initPassword() {
                try {
                    const response = await fetch('password?t=' + Date.now(), { cache: 'no-store' });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const text = await response.text();
                    const lines = text.split(/\r?\n/).map(line => line.replace(/^\uFEFF/, '').trim()).filter(line => line.length > 0);
                    
                    if (lines.length < 2) throw new Error('密码文件配置不完整。');
                    
                    hash1 = lines[0];
                    hash2 = lines[1];

                    currentQuestionIndex = Math.random() < 0.5 ? 0 : 1;
                    questionTitle.innerHTML = questions[currentQuestionIndex];
                    currentHashToCheck = currentQuestionIndex === 0 ? hash1 : hash2;

                    statusMsg.style.display = 'none';
                    submitBtn.disabled = false;
                } catch (err) {
                    console.error("读取密码失败:", err);
                    questionTitle.textContent = "加载失败";
                    statusMsg.textContent = "无法加载密码配置，请检查 password 文件。";
                    statusMsg.style.color = "#d32f2f";
                }
            }

            initPassword();

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (currentHashToCheck) validatePassword();
            });

            function validatePassword() {
                let answer = input.value.trim();
                if (!answer) return showError("请输入答案哦~");

                if (currentQuestionIndex === 1) answer = answer.toLowerCase();
                const inputHash = CryptoJS.SHA256(answer).toString(CryptoJS.enc.Hex);

                if (inputHash.toLowerCase() === currentHashToCheck.toLowerCase()) {
                    verifySection.style.display = 'none';
                    contentSection.classList.add('active');
                    input.value = '';
                    errorMsg.classList.remove('show');
                    scanImages();
                } else {
                    showError("回答不正确哦，再想想~");
                    input.value = '';
                    input.focus();
                }
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
                setTimeout(() => { errorMsg.classList.remove('show'); }, 2000);
            }

            // ==========================================
            // 2. 图片顺序探测逻辑 (大幅优化速度)
            // ==========================================
            async function scanImages() {
                const extensions = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG', 'webp', 'WEBP'];
                allImages = [];
                let consecutiveMisses = 0;
                let index = 1;
                
                // 设置最大扫描上限，防止无限循环（您可以按需修改，比如您最多有50张图，就设为50）
                const MAX_SCAN = 100; 

                while (index <= MAX_SCAN) {
                    const url = await probeImage(index, extensions);
                    
                    if (url) {
                        allImages.push(url);
                        consecutiveMisses = 0; // 找到了，重置连续未找到计数器
                    } else {
                        consecutiveMisses++;
                        // 如果连续 3 个序号都找不到图，说明后面大概率也没图了，提前终止扫描
                        if (consecutiveMisses >= 3) {
                            break;
                        }
                    }
                    index++;
                }

                if (allImages.length === 0) {
                    galleryContainer.innerHTML = `<div class="loading-status">暂时没有找到照片哦。<br>请确保在根目录下有 <b>photo</b> 文件夹，<br>且图片命名为 <b>1.jpg</b>。</div>`;
                    return;
                }

                totalPages = Math.ceil(allImages.length / IMAGES_PER_PAGE);
                totalPagesSpan.textContent = totalPages;
                pageInput.max = totalPages;
                
                if (totalPages > 1) {
                    paginationControls.style.display = 'flex';
                }

                currentPage = 1;
                renderPage();
            }

            // 逐个探测单张图片（顺序执行，减轻并发压力）
            function probeImage(index, extensions) {
                return new Promise((resolve) => {
                    let extIndex = 0;
                    function tryNext() {
                        if (extIndex >= extensions.length) return resolve(null);
                        
                        const ext = extensions[extIndex];
                        const imgSrc = `./photo/${index}.${ext}?v=${Date.now()}`;
                        const img = new Image();
                        
                        img.onload = () => resolve(imgSrc);
                        img.onerror = () => {
                            extIndex++;
                            tryNext();
                        };
                        img.src = imgSrc;
                    }
                    tryNext();
                });
            }

            // 渲染当前页
            function renderPage() {
                galleryContainer.innerHTML = '';
                
                const startIndex = (currentPage - 1) * IMAGES_PER_PAGE;
                const endIndex = Math.min(startIndex + IMAGES_PER_PAGE, allImages.length);
                const pageImages = allImages.slice(startIndex, endIndex);

                pageImages.forEach((src, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'photo-item';
                    wrapper.style.animationDelay = `${idx * 0.1}s`;
                    
                    const imgEl = document.createElement('img');
                    imgEl.src = src;
                    imgEl.alt = `照片`;
                    imgEl.loading = 'lazy';
                    
                    wrapper.appendChild(imgEl);
                    galleryContainer.appendChild(wrapper);
                });

                updatePaginationUI();
            }

            function updatePaginationUI() {
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
                pageInput.value = currentPage;
            }

            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            pageInput.addEventListener('change', (e) => {
                let val = parseInt(e.target.value);
                if (isNaN(val) || val < 1) val = 1;
                if (val > totalPages) val = totalPages;
                
                if (val !== currentPage) {
                    currentPage = val;
                    renderPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    e.target.value = currentPage;
                }
            });

            pageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    pageInput.blur();
                }
            });
        });
    </script>
</body>
</html>
