    <main>
        <div class="welcome-card">
            <div class="welcome-text" id="welcome-text"><span style="animation-delay: 0s, 0s;">上</span><span style="animation-delay: 0.06s, 0.1s;">海</span><span style="animation-delay: 0.12s, 0.2s;">市</span><span style="animation-delay: 0.18s, 0.3s;">包</span><span style="animation-delay: 0.24s, 0.4s;">头</span><span style="animation-delay: 0.3s, 0.5s;">中</span><span style="animation-delay: 0.36s, 0.6s;">学</span><span style="animation-delay: 0.42s, 0.7s;">2</span><span style="animation-delay: 0.48s, 0.8s;">0</span><span style="animation-delay: 0.54s, 0.9s;">2</span><span style="animation-delay: 0.6s, 1s;">7</span><span style="animation-delay: 0.66s, 1.1s;">届</span><span style="animation-delay: 0.72s, 1.2s;">3</span><span style="animation-delay: 0.78s, 1.3s;">班</span></div>

        <section class="comment-card">
            <div class="comment-title">💬 留言板</div>

            <div class="auth-panel">
                <div class="auth-head">
                    <span class="auth-head__title">🔐 账号</span>
                    <span id="auth-status" class="is-guest">当前：游客</span>
                </div>

                <!-- 已登录时显示 -->
                <div class="auth-user" id="auth-user" hidden>
                    <button id="edit-nick-btn" type="button" class="ghost">修改昵称</button>
                    <button id="signout-btn" type="button" class="ghost">退出登录</button>
                </div>

                <!-- 修改昵称面板 -->
                <div id="nick-pane" hidden>
                    <div class="auth-row">
                        <input id="nick-input" type="text" maxlength="20" autocomplete="nickname"
                               placeholder="新昵称（最多 20 字）">
                        <button id="nick-save-btn" type="button">保存</button>
                    </div>
                    <div class="auth-row">
                        <button id="nick-cancel-btn" type="button" class="ghost wide">取消</button>
                    </div>
                    <p class="auth-tip" id="nick-tip">改的是以后留言用的昵称，已发出去的旧留言不会改名。</p>
                </div>

                <!-- 未登录时显示：登录 / 注册 -->
                <div id="auth-guest">
                    <div class="auth-tabs">
                        <button id="tab-login" type="button" class="tab is-active">登录</button>
                        <button id="tab-register" type="button" class="tab">注册</button>
                    </div>

                    <!-- 登录 -->
                    <div id="login-pane">

                                   placeholder="密码" maxlength="64">

                        <div class="auth-row">

                    </div>

                    <div id="register-pane" hidden>
                        <div class="auth-row">
                            <input id="reg-email" type="email" inputmode="email" autocomplete="email"

                            <button id="send-btn" type="button">获取验证码</button>
                        </div>
                        <div class="auth-row">
                            <input id="code-input" type="text" inputmode="numeric" autocomplete="one-time-code"
                                   placeholder="验证码" maxlength="8">

                            <input id="reg-password" type="password" autocomplete="new-password"

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const textElement = document.getElementById('welcome-text');
            const text = textElement.textContent.trim();

            textElement.innerHTML = '';
            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                span.textContent = text[i];

    <script>

            function isOwnComment(c) {

            function saveNick() {

                auth.nick = nick;
                writeStore(NICK_KEY, nick);
                rememberNick(nick, auth.email);
                // 用这个邮箱发过的旧留言，指纹表里也把昵称同步掉
                var aid = agentId(auth.email);
                if (aid) rememberAgent(nick, auth.email);
                applyAuthState();
                closeNickEditor();
                if ($('cm-msg')) { $('cm-msg').textContent = '昵称已改为 ' + nick + '。'; $('cm-msg').className = 'cm-msg'; }
            }

            function resetSendButton() {
                clearInterval(sendTimer); sendTimer = null;
                var btn = $('send-btn');
                if (btn) { btn.textContent = '获取验证码'; btn.disabled = false; }
            }

            function switchTab(which) {
                var isLogin = which !== 'register';
                if ($('login-pane')) $('login-pane').hidden = !isLogin;
                if ($('register-pane')) $('register-pane').hidden = isLogin;
                if ($('tab-login')) $('tab-login').className = 'tab' + (isLogin ? ' is-active' : '');
                if ($('tab-register')) $('tab-register').className = 'tab' + (isLogin ? '' : ' is-active');
                // 切换时把提示复位，别把上一页的报错留在那儿
                var tip = $('auth-tip');
                if (tip) tip.textContent = isLogin
                    ? '用注册时的邮箱和密码登录。'
                    : '填写邮箱 → 获取验证码 → 设置密码，完成注册。';
            }

            function login(emailInput, passwordInput, btn, onOk) {
                var email = (emailInput.value || '').trim();
                var password = passwordInput.value || '';
                if (!email) { setStatus('请填写邮箱', 'error'); emailInput.focus(); return; }
                if (!isEmail(email)) { setStatus('邮箱格式不对', 'error'); emailInput.focus(); return; }
                if (!password) { setStatus('请填写密码', 'error'); passwordInput.focus(); return; }

                btn.disabled = true;
                setStatus('正在登录…', 'busy');
                postJSON(AUTH_API + '/api/login', { email: email, password: password }, function (err, data) {
                    btn.disabled = false;
                    if (err || isFail(data)) {
                        setStatus('登录失败：' + ((err && err.message) || '请稍后再试'), 'error');
                        return;
                    }
                    var token = pickToken(data);
                    if (!token) { setStatus('登录失败：服务器没有返回 token', 'error'); return; }
                    auth.token = String(token);
                    auth.email = email;
                    auth.nick = resolveNick(data, email, [agentNickForEmail(email), readStore(NICK_KEY)]);
                    writeStore(TOKEN_KEY, auth.token);
                    writeStore(EMAIL_KEY, email);
                    writeStore(NICK_KEY, auth.nick);
                    rememberNick(auth.nick, email);
                    applyAuthState();
                    if (onOk) onOk();
                });
            }

            // ---------- 获取验证码（60 秒倒计时） ----------
            function sendCode() {
                var emailEl = $('reg-email');
                var btn = $('send-btn');
                var email = (emailEl.value || '').trim();
                if (!email) { setStatus('请先填写邮箱', 'error'); emailEl.focus(); return; }
                if (!isEmail(email)) { setStatus('邮箱格式不对', 'error'); emailEl.focus(); return; }

                btn.disabled = true;
                setStatus('正在发送…', 'busy');
                postJSON(AUTH_API + '/api/send-code', { email: email }, function (err, data) {
                    if (err || isFail(data)) {
                        // 后端会直接给出人话，例如「请勿使用 Outlook 邮箱，建议使用 QQ 或 163 邮箱」
                        var m = (err && err.message) || '发送失败，请稍后再试';
                        setStatus(m, 'error');
                        btn.disabled = false;
                        return;
                    }
                    writeStore(EMAIL_KEY, email);
                    setStatus('验证码已发送，请查收邮箱', 'busy');
                    var left = 60;
                    btn.textContent = left + ' 秒后重发';
                    clearInterval(sendTimer);
                    sendTimer = setInterval(function () {
                        left--;
                        if (left <= 0) { resetSendButton(); return; }
                        btn.textContent = left + ' 秒后重发';
                    }, 1000);
                    if ($('code-input')) $('code-input').focus();
                });
            }

            // ---------- 注册 ----------
            function register() {
                var emailEl = $('reg-email');
                var codeEl = $('code-input');
                var pwdEl = $('reg-password');
                var nickEl = $('reg-nick');
                var btn = $('register-btn');
                var email = (emailEl.value || '').trim();
                var code = (codeEl.value || '').trim();
                var password = pwdEl.value || '';
                var nick = nickEl ? (nickEl.value || '').trim() : '';

                if (!email) { setStatus('请填写邮箱', 'error'); emailEl.focus(); return; }
                if (!isEmail(email)) { setStatus('邮箱格式不对', 'error'); emailEl.focus(); return; }
                if (!code) { setStatus('请填写验证码', 'error'); codeEl.focus(); return; }
                if (!password) { setStatus('请设置密码', 'error'); pwdEl.focus(); return; }
                if (password.length < 6) { setStatus('密码至少 6 位', 'error'); pwdEl.focus(); return; }
                if (!nick) { setStatus('请填写昵称', 'error'); nickEl.focus(); return; }
                if (nick.length > 20) { setStatus('昵称最多 20 个字', 'error'); nickEl.focus(); return; }
                // 昵称紧贴 [已验证] 徽章显示，别让人把徽章伪装进昵称里
                if (/[\[\]<>]/.test(nick)) {
                    setStatus('昵称不能包含 [ ] < > 这些符号', 'error'); nickEl.focus(); return;
                }
                if (nickTaken(nick)) {
                    setStatus('这个昵称已经被别人用了，换一个吧', 'error'); nickEl.focus(); return;
                }

                btn.disabled = true;
                setStatus('正在注册…', 'busy');
                postJSON(AUTH_API + '/api/register',
                    { email: email, code: code, password: password, nick: nick },
                    function (err, data) {
                        btn.disabled = false;
                        if (err || isFail(data)) {
                            var m = (err && err.message) || '请稍后再试';
                            // 后端如果自己也做了重名检查，原样透出
                            if (/昵称/.test(m)) {
                                setStatus('注册失败：' + m, 'error');
                                if (nickEl) nickEl.focus();
                                return;
                            }
                            setStatus('注册失败：' + m, 'error');
                            return;
                        }
                        var token = pickToken(data);
                        if (!token) { setStatus('注册失败：服务器没有返回 token', 'error'); return; }
                        auth.token = String(token);
                        auth.email = email;
                        auth.nick = nick || resolveNick(data, email, [readStore(NICK_KEY)]);
                        writeStore(TOKEN_KEY, auth.token);
                        writeStore(EMAIL_KEY, email);
                        writeStore(NICK_KEY, auth.nick);
                        rememberNick(auth.nick, email);
                        resetSendButton();
                        applyAuthState();
                    });
            }

            // ---------- 退出 ----------
            function signOut() {
                auth.token = '';
                auth.email = '';
                auth.nick = '';
                writeStore(TOKEN_KEY, '');
                writeStore(EMAIL_KEY, '');
                writeStore(NICK_KEY, '');
                closeNickEditor();
                applyAuthState();
                switchTab('login');
            }

            // ---------- 启动时校验本地 token ----------
            function checkToken() {
                var token = readStore(TOKEN_KEY);
                auth.nick = readStore(NICK_KEY);
                if (!token) { auth.token = ''; auth.email = ''; applyAuthState(); return; }
                auth.token = token;
                auth.email = readStore(EMAIL_KEY);
                setStatus('正在校验登录状态…', 'busy');
                postJSON(AUTH_API + '/api/check-token', { token: token }, function (err, data) {
                    if (err || isFail(data)) {
                        // token 失效（后端会回「登录已过期」）：静默退出，不弹错误
                        auth.token = '';
                        auth.email = '';
                        auth.nick = '';
                        writeStore(TOKEN_KEY, '');
                        console.warn('[留言板] token 校验失败：', (err && err.message) || '');
                        applyAuthState();
                        return;
                    }
                    var email = data.email || (data.data && data.data.email) || readStore(EMAIL_KEY) || '';
                    auth.email = email;
                    if (email) writeStore(EMAIL_KEY, email);
                    // 后端常常不返昵称，不能拿邮箱前缀把本地记着的正确昵称冲掉
                    var nick = resolveNick(data, email, [auth.nick, agentNickForEmail(email), readStore(NICK_KEY)]);
                    auth.nick = nick;
                    writeStore(NICK_KEY, nick);
                    rememberNick(nick, email);
                    applyAuthState();
                });
            }

            // ---------- 留言列表 ----------
            function fetchComments(cb) {
                postJSON(TWIKOO_ENV + '/', {
                    event: 'GET_RECENT_COMMENTS',
                    pageSize: 100,
                    includeReply: false,
                    envId: TWIKOO_ENV
                }, function (err, data) {
                    if (err || isFail(data)) return cb(err || new Error(errText(data, null) || '读取失败'));
                    cb(null, Array.isArray(data.data) ? data.data : []);
                });
            }

            function sortDesc(a, b) { return Number(b.created) - Number(a.created); }

            // 徽章判定，三级口径（从严到宽）：
            //  1) 这条留言正文里夹着账号指纹 → 和当前账号指纹一致才算本人（最可靠）
            //  2) 全站没有任何留言带指纹（老数据）→ 退回「昵称一致且没填邮箱」
            //  3) 其他情况一律不认，宁可显示灰的，也不给别人冒名亮绿
            function isVerifiedComment(c, allHaveAgent) {
                if (!auth.token) return false;
                var cAgent = readAgent(c && c.comment);
                var myAgent = agentId(auth.email);
                if (cAgent) return !!myAgent && cAgent === myAgent;
                if (allHaveAgent) return false;
                var cNick = String(c.nick || '').trim().toLowerCase();
                var aNick = String(accountNick() || '').trim().toLowerCase();
                if (!cNick || !aNick || cNick !== aNick) return false;
                return !String(c.mail || '').trim();
            }

            function renderList(items) {
                var box = $('cm-list');
                if (!box) return;
                lastItems = items || [];
                if (!items.length) {
                    box.innerHTML = '<p class="cm-empty">还没有留言，来做第一个留言的人吧～</p>';
                    return;
                }
                // 只要库里已经出现过带指纹的留言，就认为「新规矩」已生效，不再用昵称近似
                var allHaveAgent = items.some(function (c) { return !!readAgent(c && c.comment); });
                box.innerHTML = items.map(function (c) {
                    var verified = isVerifiedComment(c, allHaveAgent);
                    var badge = loguedBadge(c, verified);
                    return '<div class="cm-item">' +
                        '<div class="cm-head"><span class="cm-name">' + esc(c.nick || '匿名') + badge + '</span>' +
                        '<span class="cm-time">' + formatTime(c.created) + '</span></div>' +
                        '<div class="cm-body">' + stripAgent(formatBody(c.comment)) + '</div></div>';
                }).join('');
            }

            // 账号留言 = 有指纹；其余都是历史游客留言，单独给个「旧留言」标记而不是绿/灰二选一
            function loguedBadge(c, verified) {
                if (verified) return '<span class="cm-badge cm-badge--verified">[已验证]</span>';
                if (readAgent(c && c.comment)) return '';
                return '<span class="cm-badge cm-badge--guest">[旧游客]</span>';
            }

            function refreshList() {
                var box = $('cm-list');
                if (box) box.innerHTML = '<p class="cm-loading">留言加载中…</p>';
                fetchComments(function (err, all) {
                    if (err) {
                        if (box) box.innerHTML = '<p class="cm-empty is-error">留言加载失败，请刷新页面重试。</p>';
                        console.error('[留言板]', err);
                        return;
                    }
                    renderList(all.filter(function (c) {
                        return c.url === BOARD_PATH || c.path === BOARD_PATH;
                    }).sort(sortDesc));
                });
            }

            // ---------- 发表留言 ----------
            function submitComment() {
                var btn = $('cm-submit');
                var msg = $('cm-msg');
                var nickEl = $('cm-nick'), mailEl = $('cm-mail'), textEl = $('cm-text');
                var nick = (nickEl.value || '').trim();
                var mail = (mailEl.value || '').trim();
                var text = (textEl.value || '').trim();
                function say(t, bad) { msg.textContent = t; msg.className = 'cm-msg' + (bad ? ' is-bad' : ''); }

                // 只有登录的账号能留言
                if (!auth.token) { say('请先登录或注册，登录后才能留言。', true); return; }
                if (!nick) { say('昵称不能为空。', true); nickEl.focus(); return; }
                if (!text) { say('留言内容不能为空。', true); textEl.focus(); return; }
                if (mail && !isEmail(mail)) { say('邮箱格式不对。', true); mailEl.focus(); return; }

                writeStore(NICK_KEY, nick);
                writeStore(MAIL_KEY, mail);
                // 发过言就记住了「这个邮箱叫什么」，以后登录不再退回邮箱前缀
                rememberNick(nick, auth.email || mail);

                // 正文夹一个隐形指纹，下次渲染时据此认人（Twikoo 只回显正文，别的字段不可靠）
                var aid = agentId(auth.email);
                if (aid) rememberAgent(accountNick(), auth.email);

                var payload = {
                    event: 'COMMENT_SUBMIT',
                    envId: TWIKOO_ENV,
                    path: BOARD_PATH,
                    url: BOARD_PATH,
                    href: location.href,
                    nick: nick,
                    mail: mail,
                    link: '',
                    ua: navigator.userAgent,
                    comment: wrapAgent(escText(text).split('\n').join('<br>'), aid),
                    pid: '',
                    rid: ''
                };
                if (auth.token) payload.token = auth.token;

                btn.disabled = true;
                say('发表中…', false);

                postJSON(TWIKOO_ENV + '/', payload, function (err, data) {
                    btn.disabled = false;
                    if (err || isFail(data)) {
                        var code = (err && err.status) || data.code || '';
                        var m = (err && err.message) || data.message || '网络错误';
                        say('发表失败' + (code ? '（' + code + '）' : '') + '：' + m, true);
                        if (err) console.error('[留言板]', err);
                        // 超时/网络错误时留言可能已落库，拉一次列表让用户自己看
                        if (err) refreshList();
                        return;
                    }
                    textEl.value = '';
                    say('发表成功！', false);
                    refreshList();
                });
            }

            // ---------- 启动 ----------
            function on(id, ev, fn) {
                var el = $(id);
                if (el) el.addEventListener(ev, fn);
            }

            function boot() {
                if ($('cm-nick')) $('cm-nick').value = readStore(NICK_KEY) || '';
                if ($('cm-mail')) $('cm-mail').value = readStore(MAIL_KEY) || '';

                on('tab-login', 'click', function () { switchTab('login'); });
                on('tab-register', 'click', function () { switchTab('register'); });

                on('login-btn', 'click', function () {
                    login($('login-email'), $('login-password'), $('login-btn'));
                });
                on('login-password', 'keydown', function (e) {
                    if (e.key === 'Enter') login($('login-email'), $('login-password'), $('login-btn'));
                });

                on('send-btn', 'click', sendCode);
                on('register-btn', 'click', register);
                on('reg-password', 'keydown', function (e) {
                    if (e.key === 'Enter') { if ($('reg-nick')) $('reg-nick').focus(); else register(); }
                });
                on('reg-nick', 'keydown', function (e) {
                    if (e.key === 'Enter') register();
                });
                on('code-input', 'keydown', function (e) {
                    if (e.key === 'Enter') { if ($('reg-password')) $('reg-password').focus(); }
                });

                on('signout-btn', 'click', signOut);
                on('edit-nick-btn', 'click', openNickEditor);
                on('nick-save-btn', 'click', saveNick);
                on('nick-cancel-btn', 'click', closeNickEditor);
                on('nick-input', 'keydown', function (e) {
                    if (e.key === 'Enter') saveNick();
                    if (e.key === 'Escape') closeNickEditor();
                });
                on('cm-submit', 'click', submitComment);

                switchTab('login');
                applyAuthState();
                checkToken();
                refreshList();
            }

            if (document.body) boot();
            else document.addEventListener('DOMContentLoaded', boot);
        })();
    </script>
</body>
</html>
