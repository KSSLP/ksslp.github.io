<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海市包头中学2027届3班</title>
    <link rel="icon" href="ciallo.png" type="image/png">
    <style>
        :root {
            --ink: #1a2b49;
            --ink-soft: #55637c;
            --accent-1: #5b8def;
            --accent-2: #8f7bf0;
            --paper: rgba(255, 255, 255, 0.72);
            --line: rgba(0, 20, 40, 0.08);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0; padding: 2rem 1rem 3rem; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink); text-align: center;
            background: linear-gradient(160deg, #eef4ff 0%, #f7f2ff 45%, #f2fbff 100%);
            overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background:
                radial-gradient(circle at 12% 18%, rgba(91, 141, 239, 0.16), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(143, 123, 240, 0.16), transparent 44%),
                radial-gradient(circle at 50% 92%, rgba(94, 209, 195, 0.14), transparent 46%);
        }
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -25px) scale(1.08); } 100% { transform: translate(-20px, 20px) scale(0.96); } }
        .bg-orb {
            position: fixed; z-index: -1; border-radius: 50%; pointer-events: none;
            filter: blur(40px); opacity: 0.55; animation: orbDrift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 320px; height: 320px; top: -80px; left: -80px; background: radial-gradient(circle, rgba(91, 141, 239, 0.55), transparent 70%); }
        .orb-2 { width: 380px; height: 380px; bottom: -120px; right: -100px; background: radial-gradient(circle, rgba(143, 123, 240, 0.5), transparent 70%); animation-delay: -6s; }
        .orb-3 { width: 260px; height: 260px; top: 45%; right: 4%; background: radial-gradient(circle, rgba(94, 209, 195, 0.45), transparent 70%); opacity: 0.4; animation-delay: -10s; }

        main { width: 100%; display: flex; flex-direction: column; align-items: center; }

        .comment-card {
            width: 100%; max-width: 880px; margin: 2rem auto 0; padding: 2.5rem 2.5rem 2rem;
            background: var(--paper); border-radius: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px -30px rgba(0, 20, 40, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            text-align: left; animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }
        .comment-title {
            margin: 0 0 1.5rem; font-size: clamp(1.2rem, 3.6vw, 1.5rem); font-weight: 700; text-align: center;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .comment-card .tk-submit { margin-bottom: 1.5rem !important; }
        @media (max-width: 480px) {
            .comment-card { padding: 1.75rem 1.1rem 1.5rem; border-radius: 2rem; }
        }

        .top-left-link {
            position: fixed; top: 1rem; left: 1rem; z-index: 10;
            padding: 0.5rem 0.95rem; border-radius: 999px;
            font-size: 0.85rem; letter-spacing: 0.02em; text-decoration: none; color: var(--ink-soft);
            background: rgba(255, 255, 255, 0.7); border: 1px solid var(--line);
            box-shadow: 0 6px 18px -12px rgba(0, 20, 40, 0.5);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            transition: color 0.25s ease, background 0.25s ease;
        }
        .top-left-link:hover { color: var(--ink); background: #fff; }

        .welcome-card {
            width: 100%; max-width: 880px; margin: 0 auto; padding: 4.5rem 3rem;
            background: var(--paper); border-radius: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 60px -30px rgba(0, 20, 40, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardEnter { 0% { opacity: 0; transform: translateY(40px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .welcome-text {
            margin: 0 0 3.5rem; font-size: clamp(1.8rem, 5.6vw, 3.4rem); font-weight: 800;
            line-height: 1.35; letter-spacing: 0.02em; word-break: break-word;
            display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
            animation: textEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes textEnter { 0% { opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        .welcome-text span {
            display: inline-block;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2) 60%, #43c8b8);
            background-size: 220% 100%;
            -webkit-background-clip: text; background-clip: text;
            color: transparent; -webkit-text-fill-color: transparent;
            animation: flow 6s ease-in-out infinite alternate, float 2.6s ease-in-out infinite alternate;
        }
        @keyframes flow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

        .go-button {
            display: inline-block; padding: 0.95rem 3rem; font-size: clamp(1.2rem, 3.6vw, 1.6rem); font-weight: 600;
            color: #fff; text-decoration: none; border-radius: 999px; border: none;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 16px 30px -16px rgba(91, 141, 239, 0.95);
            transition: transform 0.22s ease, box-shadow 0.22s ease, letter-spacing 0.25s ease;
            animation: fadeIn 0.6s ease 0.35s both;
        }
        .go-button:hover { transform: translateY(-3px); box-shadow: 0 22px 36px -16px rgba(91, 141, 239, 1); letter-spacing: 0.06em; }
        .go-button:active { transform: translateY(1px) scale(0.99); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .welcome-card { padding: 3rem 1.5rem; border-radius: 2rem; }
            .welcome-text { font-size: clamp(1.5rem, 7.5vw, 2.2rem); margin-bottom: 2.5rem; }
            .go-button { padding: 0.85rem 2.4rem; font-size: 1.15rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <a href="yskbl.html" class="top-left-link">沅神开播了</a>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <main>
        <div class="welcome-card">
            <div class="welcome-text" id="welcome-text">上海市包头中学2027届3班</div>
            <a href="content.html" class="go-button" role="button">Let's go!!!</a>
        </div>

        <section class="comment-card">
            <div class="comment-title">💬 留言板</div>
            <div id="tcomment"></div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const textElement = document.getElementById('welcome-text');
            const text = textElement.textContent.trim();

            textElement.innerHTML = '';
            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                span.textContent = text[i];
                span.style.animationDelay = `${(i * 0.06).toFixed(2)}s, ${(i * 0.1).toFixed(2)}s`;
                if (text[i] === ' ') span.style.width = '0.4em';
                textElement.appendChild(span);
            }
        });
    </script>

    <script>
        (function () {
            // jsdelivr 偶尔 502 / 被拦截，准备了多个镜像顺序尝试
            var CDN_LIST = [
                'https://cdn.jsdelivr.net/npm/twikoo@1.6.44/dist/twikoo.min.js',
                'https://fastly.jsdelivr.net/npm/twikoo@1.6.44/dist/twikoo.min.js',
                'https://unpkg.com/twikoo@1.6.44/dist/twikoo.min.js',
                'https://cdn.bootcdn.net/ajax/libs/twikoo/1.6.44/twikoo.min.js',
                'https://cdn.staticfile.org/twikoo/1.6.44/twikoo.min.js'
            ];

            function showFail(msg) {
                var el = document.getElementById('tcomment');
                if (!el) return;
                if (msg) console.error('[Twikoo]', msg);
                el.innerHTML = '<p style="color:#d64545;text-align:center;line-height:1.8;">留言板加载失败，请刷新页面重试。</p>';
            }

            function loadScript(i) {
                if (i >= CDN_LIST.length) return showFail('所有 CDN 都加载失败');
                var s = document.createElement('script');
                s.src = CDN_LIST[i];
                s.onload = function () {
                    if (typeof twikoo === 'undefined') return loadScript(i + 1);
                    startTwikoo();
                };
                s.onerror = function () {
                    console.warn('[Twikoo] CDN 加载失败，换下一个：' + CDN_LIST[i]);
                    loadScript(i + 1);
                };
                document.body.appendChild(s);
            }

            function startTwikoo() {
                twikoo.init({
                    envId: 'https://twikoo.seeout360.workers.dev',
                    el: '#tcomment',
                    lang: 'zh-CN',
                    // 隐藏“网址”输入框（Twikoo 默认就有，不是必填），只留昵称 / 邮箱 / 评论
                    style: '.tk-meta-input > .el-input:nth-child(3){display:none!important}' +
                           '.tk-meta-input{grid-template-columns:repeat(2,minmax(0,1fr))!important}'
                }).catch(function (err) {
                    showFail(err && err.message ? err.message : err);
                });
            }

            if (document.body) {
                loadScript(0);
            } else {
                document.addEventListener('DOMContentLoaded', function () { loadScript(0); });
            }
        })();
    </script>
</body>
</html>
